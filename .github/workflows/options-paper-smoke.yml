name: Options Paper Smoke

# Replay van de options-engine op de SYNTHETISCHE standaardmarkt (twee namen, 15
# handelsdagen) met de paper-broker. Fictief geld, geen netwerk, geen broker-account.
# Faalt als de engine haltte of als er na de laatste handelsdag nog een short optie
# open staat die al expireerde (exit-code van `python -m tradebot.options replay`).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"          # wekelijks, maandag 03:00 UTC
  push:
    branches: [main]
    paths:
      - "src/tradebot/options/**"
      - "src/tradebot/schemas/options.py"
      - "conf/options/**"
      - ".github/workflows/options-paper-smoke.yml"
  # Ook op elke PR die de options-code raakt: dit is de primaire setup, en zonder deze
  # trigger kon een PR de replay breken zonder dat een check rood werd (opruim-PR 2026-11-27).
  pull_request:
    paths:
      - "src/tradebot/options/**"
      - "src/tradebot/schemas/options.py"
      - "src/tradebot/risk/**"
      - "conf/options/**"
      - ".github/workflows/options-paper-smoke.yml"

permissions:
  contents: read

concurrency:
  group: options-paper-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Options replay (synthetisch, paper)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Synthetische markt
        run: python -I -m tradebot.options.data.synthetic --out "${RUNNER_TEMP}/market"

      - name: Replay
        run: python -I -m tradebot.options replay --market "${RUNNER_TEMP}/market" --out "${RUNNER_TEMP}/run"

      - name: Upload journal en samenvatting
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: options-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/run/
          retention-days: 30
