name: Security Scan

# Ook op pull requests: zonder die trigger was deze poort alleen na de merge te
# zien, en stond hij 18 runs achter elkaar rood zonder dat een PR het liet zien.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"    # Monday 06:00 UTC weekly

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Gepind, om dezelfde reden als ruff en mypy (DI-16): een ongepinde
      # scanner laat de releasedatum het oordeel bepalen.
      - run: pip install -r requirements-security.lock
      - name: Run Bandit
        run: bandit -r src/ -ll -q

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-security.lock
      # `pip-audit --require-hashes --disable-pip || true` stond hier, en die
      # regel rapporteerde per constructie niets: `--require-hashes` zonder
      # requirements-bestand is een gebruiksfout, dus de stap faalde intern,
      # en `|| true` maakte dat onzichtbaar. De CVE-poort heeft in zijn hele
      # bestaan geen enkele bevinding gemeld.
      #
      # Hij draait nu tegen de twee lockfiles -- dat zijn de versies die CI
      # en de referentie-venv daadwerkelijk installeren -- en hij mag rood
      # worden. Een CVE die hij vindt is een BEVINDING, niet iets om te
      # onderdrukken.
      - name: Audit dependencies
        run: pip-audit -r requirements.lock -r requirements-dev.lock
