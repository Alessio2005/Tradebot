name: research-run

# Onderzoeksdata ophalen waar de ontwikkelomgeving niet bij kan.
#
# De sandbox waarin de code wordt geschreven, bereikt FRED, Kraken en Binance Vision niet
# (netwerkbeleid). Een GitHub-runner wel. Deze workflow draait EEN vaste taak uit de lijst
# hieronder, uploadt wat hij schreef als artefact en commit het (optioneel) terug op de
# branch waarop hij gestart is. Er is geen vrij commando: een invoer die geen taak uit de
# lijst is, faalt.
#
# Taken:
#   external-series  `python -I -m tradebot.data.external_series` -> data/external/*.csv
#                    en artefacts/data/external_manifest.json (T-bill DTB3, €STR, funding van
#                    Kraken en Binance voor BTC en ETH, tot en met 2026-09-30).
#   v9-forward       `python -I -m tradebot.systematic.programme_v9 forward`: de vooruit-
#                    lezing van v9 op de data van Kraken, EENMAAL, vanaf 2027-04-01. Ze
#                    registreert zich in het vooruit-slot vóór de berekening; daarom gaan
#                    slot, ledger en artefacten ook na een fout mee terug (een lezing die
#                    alleen op de runner bestond, zou een tweede lezing mogelijk maken).
#   kraken-shadow    `python -I -m tradebot.carry.u1 shadow`: hetzelfde als de dagelijkse
#                    `kraken-shadow.yml`, maar op elke branch te starten (een wijziging aan
#                    de feed toetsen tegen de echte API vóór de merge). Commit niets.
#
# Starten: Actions -> research-run -> Run workflow (kies de branch), of via de API.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Welke taak"
        required: true
        type: choice
        options:
          - external-series
          - v9-forward
          - kraken-shadow
      commit_back:
        description: "Het resultaat terugcommitten op deze branch"
        required: true
        type: boolean
        default: true

concurrency:
  group: research-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Run the task
        env:
          TASK: ${{ inputs.task }}
        run: |
          case "$TASK" in
            external-series)
              echo "PATHS=data/external artefacts/data/external_manifest.json" >> "$GITHUB_ENV"
              python -I -m tradebot.data.external_series
              ;;
            v9-forward)
              echo "PATHS=artefacts/governance artefacts/research/robust_book_v9" >> "$GITHUB_ENV"
              python -I -m tradebot.systematic.programme_v9 forward
              ;;
            kraken-shadow)
              python -I -m tradebot.carry.u1 shadow --out shadow
              cat shadow/summary.md >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Onbekende taak: $TASK" >&2
              exit 1
              ;;
          esac

      - name: Upload what the task wrote
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: research-${{ inputs.task }}-${{ github.run_id }}
          path: |
            data/external/
            artefacts/data/external_manifest.json
            artefacts/governance/
            artefacts/research/robust_book_v9/
            shadow/
          if-no-files-found: error

      - name: Commit the result back
        # Ook na een fout: een geregistreerde lezing moet in de repo staan.
        if: ${{ always() && inputs.commit_back && env.PATHS != '' }}
        env:
          TASK: ${{ inputs.task }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086  # PATHS is een lijst paden uit de case hierboven
          git add -- $PATHS
          if git diff --cached --quiet; then
            echo "Niets veranderd; geen commit."
            exit 0
          fi
          git commit -m "Research run: $TASK (run $GITHUB_RUN_ID)"
          git push origin "HEAD:$BRANCH"
