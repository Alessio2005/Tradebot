name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# De lockfiles zijn op 3.13 opgelost en de vier poortworkflows draaien op
# 3.13. Diezelfde pins op 3.11 installeren is geen pin-probleem maar een
# tweede omgeving: een andere minor geeft een andere resolutie. Daarom zegt
# pyproject.toml `requires-python = ">=3.13"`: de enige interpreter die een job
# toetst.
env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # DE LINTERS ZIJN GEPIND, net als de runtime. `pyproject.toml` zet
      # `ruff>=0.1.8` en `mypy>=1.7`: ONDERGRENZEN, geen pins. Daarmee bepaalt
      # de releasedatum van ruff het oordeel van deze poort -- dezelfde
      # broncode ging van 7 naar 78 bevindingen tussen 0.15.12 en 0.16.4, en
      # een poort die van mening verandert zonder dat de code verandert,
      # bewaakt niets. `hygiene.yml` installeert daarom sinds Phase 7/8 Stage
      # A-2 uit de lockfiles; DEZE job deed dat niet, en dat is de reden dat
      # hij rood kon worden zonder dat er een commit tussen zat.
      #
      # Er komt hier geen TWEEDE pin-mechanisme bij (R-3): dit zijn dezelfde
      # twee lockfiles, met dezelfde ruff==0.15.12 en mypy==2.3.1.
      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Ruff
        run: ruff check src/ tests/
      - name: Mypy
        run: mypy src/tradebot/schemas/ src/tradebot/utils/ --ignore-missing-imports

  test-fast:
    name: Fast tests (not slow, not regression)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Zelfde reden als in de lint-job: een testketen op ongepinde deps
      # meet de releasekalender mee. pandas en numpy staan in
      # requirements.lock op 2.3.3 en 1.26.4; `.[dev]` zou hier pandas 3.x
      # binnenhalen, een MAJOR verschil.
      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
          pip install -e . --no-deps
      # Geen dekkingsmeting en geen Codecov-upload hier. De upload had geen
      # token en `fail_ci_if_error: false`, dus hij kon stil niets doen. De
      # dekkingspoort (fail_under = 100) staat in `inventory.yml`.
      - name: Run fast tests
        run: pytest -m "not slow and not regression" -q

  # Wat `test-fast` bewust deselecteert (`slow`, `regression`) plus de twee
  # markers die tot nu toe alleen in een nachtelijke workflow liepen
  # (`benchmark`, `e2e`). Daarmee draait elke test van deze repository op elke
  # pull request; er is geen testsubset meer die pas na de merge rood kan worden.
  # `tests/unit/test_ci_runs_every_test.py` bewaakt dat de twee selecties samen
  # alles dekken: een nieuwe marker die nergens wordt geselecteerd maakt die
  # test rood. Geen dekkingsmeting hier: de dekkingspoort staat in `inventory`.
  test-slow:
    name: Slow, regression, benchmark and e2e tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
          pip install -e . --no-deps
      # De bevroren baselines staan in git (DI-25). `test_bitequivalence.py`
      # faalt zelf als ze ontbreken; er wordt niets stil overgeslagen.
      - name: Run the tests the fast job deselects
        run: pytest -m "slow or regression or benchmark or e2e" --tb=short -q
