name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# De lockfiles zijn op 3.13 opgelost en de vier poortworkflows draaien op
# 3.13. Diezelfde pins op 3.11 installeren is geen pin-probleem maar een
# tweede omgeving: een andere minor geeft een andere resolutie.
# `requires-python = ">=3.10"` in pyproject.toml is daarmee een claim die
# door geen enkele job wordt getoetst; zie DI-24.
env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # DE LINTERS ZIJN GEPIND, net als de runtime. `pyproject.toml` zet
      # `ruff>=0.1.8` en `mypy>=1.7`: ONDERGRENZEN, geen pins. Daarmee bepaalt
      # de releasedatum van ruff het oordeel van deze poort -- dezelfde
      # broncode ging van 7 naar 78 bevindingen tussen 0.15.12 en 0.16.4, en
      # een poort die van mening verandert zonder dat de code verandert,
      # bewaakt niets. `hygiene.yml` installeert daarom sinds Phase 7/8 Stage
      # A-2 uit de lockfiles; DEZE job deed dat niet, en dat is de reden dat
      # hij rood kon worden zonder dat er een commit tussen zat.
      #
      # Er komt hier geen TWEEDE pin-mechanisme bij (R-3): dit zijn dezelfde
      # twee lockfiles, met dezelfde ruff==0.15.12 en mypy==2.3.1.
      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Ruff
        run: ruff check src/ tests/
      - name: Mypy
        run: mypy src/tradebot/schemas/ src/tradebot/utils/ --ignore-missing-imports

  test-fast:
    name: Fast tests (not slow, not regression)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Zelfde reden als in de lint-job: een testketen op ongepinde deps
      # meet de releasekalender mee. pandas en numpy staan in
      # requirements.lock op 2.3.3 en 1.26.4; `.[dev]` zou hier pandas 3.x
      # binnenhalen, een MAJOR verschil.
      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Run fast tests
        run: pytest -m "not slow and not regression" --cov=src/tradebot --cov-report=xml -q
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false
