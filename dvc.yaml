# dvc.yaml — Tradebot DAG Pipeline
#
# Stages: build_features → tune_hparams → train_cpcv
# (Stage 4 backtest_portfolio is in Phase 5 verwijderd; zie onder.)
#
# Usage:
#   dvc repro                          # full rebuild (only stale stages)
#   dvc repro build_features[BTCUSDT]  # single symbol
#   dvc repro -P                       # CI subset (set params.yaml ci_mode: true)
#
# Reproducibility guarantee:
#   Same code + same config + same data → same artefacts.
#   DVC hashes inputs/code/params. Cached outputs are reused.
#   Use `dvc push` + `dvc pull` for team artefact sharing.
#
# Phase 1 (2026-08-22): `${item}` interpoleerde een DICT voor elke stage die
# over `symbol_side_pairs` itereert (een lijst van {symbol, side}-mappings).
# DVC kan een dict niet in een pad stringificeren, waardoor `dvc repro` en zelfs
# `dvc add` afbraken met "Cannot interpolate data of type 'dict'". De pipeline
# is dus NOOIT uitvoerbaar geweest en de reproduceerbaarheidsgarantie hierboven
# werd nergens afgedwongen. Gecorrigeerd naar `${item.symbol}_${item.side}`.
#
# REFACTOR_BLUEPRINT §3.4: DVC + Hydra integration.
#   params.yaml is a thin shim exposing Hydra config keys for DVC tracking.
#   Hydra remains the config ground-truth; DVC triggers re-run on hash change.

vars:
  - params.yaml

stages:

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 0: Sync high-resolution aggTrade data from Binance Vision
  # Output: market_data_parquet/{symbol}/{year}/{symbol}_YYYY-MM.parquet
  # ────────────────────────────────────────────────────────────────────────────
  data_sync:
    foreach: ${symbols}
    do:
      cmd: python -m apps.data_sync sync_symbol=${item}
      deps:
        - apps/data_sync.py
        - conf/data_sync.yaml
      outs:
        - market_data_parquet/${item}/


  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 1: Raw data → Bars → Features → Events
  # Per-symbol, embarrassingly parallel.
  # ────────────────────────────────────────────────────────────────────────────
  build_features:
    foreach: ${symbols}
    do:
      cmd: python -m apps.build_features symbol=${item}
      deps:
        - apps/build_features.py
        - src/tradebot/data/ingestion.py
        - src/tradebot/data/macro.py
        - src/tradebot/features/pipeline.py
        - src/tradebot/labeling/cusum.py
        - src/tradebot/schemas/bars.py
        - src/tradebot/schemas/features.py
        - src/tradebot/schemas/events.py
        - conf/conf_config.yaml
        - conf/symbols/${item}.yaml
      params:
        - params.yaml:
          - training.cusum_threshold_multiplier
          - training.label_horizon
      outs:
        - artefacts/bars/${item}.parquet
        - artefacts/features/${item}.parquet
        - artefacts/events/${item}.parquet
        - artefacts/feature_map_${item}.json
        # Phase 1: was `artefacts/orthogonalizers/` - een MAP die door elke
        # symbol-instantie van deze stage werd geclaimd, waardoor DVC
        # overlappende outputs meldde en het hele project weigerde te laden.
        - artefacts/orthogonalizers/${item}.joblib

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 2: Features + Events → Optuna best hyperparameters
  # Per (symbol × side) pair. Resumeable via SQLite study.
  # ────────────────────────────────────────────────────────────────────────────
  tune_hparams:
    foreach: ${symbol_side_pairs}
    do:
      cmd: python -m apps.tune_hparams pair=${item.symbol}_${item.side}
      deps:
        - apps/tune_hparams.py
        - src/tradebot/tune/objective.py
        - src/tradebot/tune/search_space.py
        - src/tradebot/tune/pruning.py
        - src/tradebot/cv/cpcv.py
        - src/tradebot/cv/uniqueness.py
        - src/tradebot/labeling/triple_barrier.py
        # Stage 1 outputs
        - artefacts/features/${item.symbol}.parquet
        - artefacts/events/${item.symbol}.parquet
      params:
        - params.yaml:
          - training.optuna_trials
          - training.optuna_timeout_seconds
          - training.cpcv_n_groups
          - training.cpcv_n_test_groups
      outs:
        - artefacts/hparams/${item.symbol}_${item.side}_study.db
      metrics:
        - artefacts/hparams/${item.symbol}_${item.side}_best_score.json:
            cache: false
      # best_params JSON is a metric-like artefact we always want to track.
      # Written by the entrypoint alongside the study db.

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 3: Best params → CPCV ensemble + Platt calibration
  # Per (symbol × side). Deterministic given seed.
  # ────────────────────────────────────────────────────────────────────────────
  train_cpcv:
    foreach: ${symbol_side_pairs}
    do:
      cmd: python -m apps.train_cpcv pair=${item.symbol}_${item.side}
      deps:
        - apps/train_cpcv.py
        - src/tradebot/cv/cpcv.py
        - src/tradebot/cv/uniqueness.py
        - src/tradebot/labeling/trend_scanning.py
        - src/tradebot/features/blocks.py
        # Stage 1 + 2 outputs
        - artefacts/features/${item.symbol}.parquet
        - artefacts/events/${item.symbol}.parquet
        - artefacts/hparams/${item.symbol}_${item.side}.json
      params:
        - params.yaml:
          - training.label_t_min
          - training.label_horizon
          - training.cpcv_n_groups
          - training.cpcv_n_test_groups
      outs:
        - artefacts/models/${item.symbol}_${item.side}_ensemble.joblib
        - artefacts/calibrators/${item.symbol}_${item.side}_platt.joblib
        - artefacts/oos_probs/${item.symbol}_${item.side}.parquet

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 4 en 4.5 — VERWIJDERD IN PHASE 5
  #
  # `backtest_portfolio` en `make_tearsheet` dreven `bidirectional_backtest`
  # en `PortfolioBacktester`. Beide engines zijn verwijderd na het
  # pariteitsbewijs (audit sectie 16.1 en sectie 24 schrijven consolidatie tot
  # EEN event-driven engine voor, met een pariteitstest als vereist bewijs).
  #
  #   bewijs      : tests/integration/test_engine_parity.py
  #   vergelijking: reports/phase5_engine_diff.md
  #   opvolger    : src/tradebot/backtest/engine.py (EventDrivenEngine)
  #
  # De opvolger heeft nog GEEN DVC-stage. Hij draait op de gecertificeerde
  # PIT-store en niet op `artefacts/oos_probs/`, en de baseline-keten die hem
  # aanroept loopt via `apps/run_baseline.py`. Een eigen stage volgt zodra de
  # ML-track (Stage 2-3) een pre-registratie heeft die op deze engine is
  # geschreven; dat is Phase 6-werk en staat als zodanig in
  # `reports/phase5_exit_report.md`.

