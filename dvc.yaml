# dvc.yaml — Tradebot DAG Pipeline
#
# Stages: build_features → tune_hparams → train_cpcv
# (Stage 4 backtest_portfolio is in Phase 5 verwijderd; zie onder.)
#
# Usage:
#   dvc repro                          # full rebuild (only stale stages)
#   dvc repro build_features[BTCUSDT]  # single symbol
#   dvc repro -P                       # CI subset (set params.yaml ci_mode: true)
#
# Reproducibility guarantee:
#   Same code + same config + same data → same artefacts.
#   DVC hashes inputs/code/params. Cached outputs are reused.
#   Use `dvc push` + `dvc pull` for team artefact sharing.
#
# Phase 1 (2026-08-22): `${item}` interpoleerde een DICT voor elke stage die
# over `symbol_side_pairs` itereert (een lijst van {symbol, side}-mappings).
# DVC kan een dict niet in een pad stringificeren, waardoor `dvc repro` en zelfs
# `dvc add` afbraken met "Cannot interpolate data of type 'dict'". De pipeline
# is dus NOOIT uitvoerbaar geweest en de reproduceerbaarheidsgarantie hierboven
# werd nergens afgedwongen. Gecorrigeerd naar `${item.symbol}_${item.side}`.
#
# REFACTOR_BLUEPRINT §3.4: DVC + Hydra integration.
#   params.yaml is a thin shim exposing Hydra config keys for DVC tracking.
#   Hydra remains the config ground-truth; DVC triggers re-run on hash change.

vars:
  - params.yaml

stages:

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 0: Sync high-resolution aggTrade data from Binance Vision
  # Output: market_data_parquet/{symbol}/{year}/{symbol}_YYYY-MM.parquet
  # ────────────────────────────────────────────────────────────────────────────
  data_sync:
    foreach: ${symbols}
    do:
      cmd: python -m apps.data_sync sync_symbol=${item}
      deps:
        - apps/data_sync.py
        - conf/data_sync.yaml
      outs:
        - market_data_parquet/${item}/


  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 1: Raw data → Bars → Features → Events
  # Per-symbol, embarrassingly parallel.
  # ────────────────────────────────────────────────────────────────────────────
  build_features:
    foreach: ${symbols}
    do:
      cmd: python -m apps.build_features symbol=${item}
      deps:
        - apps/build_features.py
        - src/tradebot/data/ingestion.py
        - src/tradebot/data/macro.py
        - src/tradebot/features/pipeline.py
        - src/tradebot/labeling/cusum.py
        - src/tradebot/schemas/bars.py
        - src/tradebot/schemas/features.py
        - src/tradebot/schemas/events.py
        - conf/conf_config.yaml
        - conf/symbols/${item}.yaml
      params:
        - params.yaml:
          - training.cusum_threshold_multiplier
          - training.label_horizon
      outs:
        - artefacts/bars/${item}.parquet
        - artefacts/features/${item}.parquet
        - artefacts/events/${item}.parquet
        - artefacts/feature_map_${item}.json
        # Phase 1: was `artefacts/orthogonalizers/` - een MAP die door elke
        # symbol-instantie van deze stage werd geclaimd, waardoor DVC
        # overlappende outputs meldde en het hele project weigerde te laden.
        - artefacts/orthogonalizers/${item}.joblib

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 2: Features + Events → Optuna best hyperparameters
  # Per (symbol × side) pair. Resumeable via SQLite study.
  # ────────────────────────────────────────────────────────────────────────────
  tune_hparams:
    foreach: ${symbol_side_pairs}
    do:
      cmd: python -m apps.tune_hparams pair=${item.symbol}_${item.side}
      deps:
        - apps/tune_hparams.py
        - src/tradebot/tune/objective.py
        - src/tradebot/tune/search_space.py
        - src/tradebot/tune/pruning.py
        - src/tradebot/cv/cpcv.py
        - src/tradebot/cv/uniqueness.py
        - src/tradebot/labeling/triple_barrier.py
        # Stage 1 outputs
        - artefacts/features/${item.symbol}.parquet
        - artefacts/events/${item.symbol}.parquet
      params:
        - params.yaml:
          - training.optuna_trials
          - training.optuna_timeout_seconds
          - training.cpcv_n_groups
          - training.cpcv_n_test_groups
      outs:
        - artefacts/hparams/${item.symbol}_${item.side}_study.db
      metrics:
        - artefacts/hparams/${item.symbol}_${item.side}_best_score.json:
            cache: false
      # best_params JSON is a metric-like artefact we always want to track.
      # Written by the entrypoint alongside the study db.

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 3: Best params → CPCV ensemble + Platt calibration
  # Per (symbol × side). Deterministic given seed.
  # ────────────────────────────────────────────────────────────────────────────
  train_cpcv:
    foreach: ${symbol_side_pairs}
    do:
      cmd: python -m apps.train_cpcv pair=${item.symbol}_${item.side}
      deps:
        - apps/train_cpcv.py
        - src/tradebot/cv/cpcv.py
        - src/tradebot/cv/uniqueness.py
        - src/tradebot/labeling/trend_scanning.py
        - src/tradebot/features/blocks.py
        # Stage 1 + 2 outputs
        - artefacts/features/${item.symbol}.parquet
        - artefacts/events/${item.symbol}.parquet
        - artefacts/hparams/${item.symbol}_${item.side}.json
      params:
        - params.yaml:
          - training.label_t_min
          - training.label_horizon
          - training.cpcv_n_groups
          - training.cpcv_n_test_groups
      outs:
        - artefacts/models/${item.symbol}_${item.side}_ensemble.joblib
        - artefacts/calibrators/${item.symbol}_${item.side}_platt.joblib
        - artefacts/oos_probs/${item.symbol}_${item.side}.parquet

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 4 en 4.5 — VERWIJDERD IN PHASE 5
  #
  # `backtest_portfolio` en `make_tearsheet` dreven `bidirectional_backtest`
  # en `PortfolioBacktester`. Beide engines zijn verwijderd na het
  # pariteitsbewijs (audit sectie 16.1 en sectie 24 schrijven consolidatie tot
  # EEN event-driven engine voor, met een pariteitstest als vereist bewijs).
  #
  #   bewijs      : tests/integration/test_engine_parity.py
  #   vergelijking: reports/phase5_engine_diff.md
  #   opvolger    : src/tradebot/backtest/engine.py (EventDrivenEngine)
  #
  # De opvolger had toen nog GEEN DVC-stage. Die staat er nu, hieronder, als
  # `phase5_revaluation` en de Phase 6-stages die erop volgen (Phase 6 stap 10,
  # deliverable 5; exit-criterium 17).

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 5: DE AUTHORITATIVE ENGINE — Phase 6 stap 10, deliverable 5
  #
  # WAAROM DEZE STAGE ER MOET ZIJN
  # Exit-criterium 17 eist dat elke Phase 6-run reproduceerbaar is uit
  # `data_hash` + `config_hash` + git-sha. Twee van die drie zaten al in elk
  # artefact; wat ontbrak is het DERDE: een manier om de run OPNIEUW TE DRAAIEN
  # en te zien dat er hetzelfde uitkomt. Een hash die je niet kunt narekenen,
  # bewijst alleen dat er iets is gebeurd.
  #
  # De stages hieronder hangen aan elkaar via hun artefacten, in de volgorde
  # waarin zij ook feitelijk zijn gedraaid:
  #
  #   phase5_revaluation ─┐
  #   phase6_adequacy ────┼─→ phase6_h1_competition   (QLIKE, stap 7)
  #   phase6_econometrics ┘   phase6_h2_regime        (M0 vs. HMM, stap 11)
  #
  # De gecertificeerde PIT-store staat in git en niet onder DVC (AD-12); hij is
  # daarom een gewone `deps`-boom en geen stage-output.
  # ────────────────────────────────────────────────────────────────────────────
  phase5_revaluation:
    cmd: python apps/run_phase5_baseline.py
    deps:
      - apps/run_phase5_baseline.py
      - src/tradebot/backtest/phase5_baseline.py
      - src/tradebot/backtest/engine.py
      - src/tradebot/backtest/accounting.py
      - src/tradebot/backtest/baseline_runner.py
      - src/tradebot/execution/order_router.py
      - src/tradebot/execution/impact_model.py
      - src/tradebot/risk/engine.py
      - src/tradebot/alpha/momentum.py
      - src/tradebot/volatility/ewma.py
      - data/pit_store
      - artefacts/governance/data_hashes.json
      - conf/risk/default.yaml
      - conf/execution/fees.yaml
      - conf/execution/impact.yaml
      - conf/model/alpha.yaml
      - conf/model/volatility.yaml
      - conf/backtest/default.yaml
      - conf/data/default.yaml
    outs:
      - artefacts/baseline/phase5_revaluation.json:
          cache: false

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 6: DE POORTEN DIE VOOR ELKE FIT STAAN
  # Draait VOOR elk model. Blijkt hier al dat een modelklasse onhaalbaar is,
  # dan is dat de goedkoopste bevinding van de fase.
  # ────────────────────────────────────────────────────────────────────────────
  phase6_adequacy:
    cmd: python apps/run_data_adequacy.py
    deps:
      - apps/run_data_adequacy.py
      - src/tradebot/validation/data_adequacy.py
      - src/tradebot/validation/adequacy_report.py
      - src/tradebot/data/phase6_universe.py
      - data/pit_store
      - artefacts/governance/data_hashes.json
      - conf/model/adequacy.yaml
      - conf/validation/default.yaml
    outs:
      - artefacts/governance/phase6_data_adequacy.json:
          cache: false

  phase6_econometrics:
    cmd: python apps/run_econometric_diagnostics.py
    deps:
      - apps/run_econometric_diagnostics.py
      - src/tradebot/validation/econometrics.py
      - src/tradebot/validation/diagnostics_report.py
      - src/tradebot/features/fracdiff.py
      - src/tradebot/data/phase6_universe.py
      - data/pit_store
      - artefacts/governance/data_hashes.json
      - conf/validation/econometrics.yaml
      - conf/model/fracdiff.yaml
    outs:
      - artefacts/governance/phase6_econometrics.json:
          cache: false

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 7: DE CAMPAGNES. Elk oordeel dat in de ledger belandt, komt hieruit.
  # ────────────────────────────────────────────────────────────────────────────
  phase6_h1_competition:
    cmd: python apps/run_vol_competition.py
    deps:
      - apps/run_vol_competition.py
      - src/tradebot/validation/vol_campaign.py
      - src/tradebot/validation/vol_competition.py
      - src/tradebot/validation/vol_metrics.py
      - src/tradebot/volatility/garch.py
      - src/tradebot/volatility/realized.py
      - src/tradebot/reporting/phase6_vol_competition.py
      - src/tradebot/data/phase6_universe.py
      - artefacts/governance/phase6_data_adequacy.json
      - artefacts/governance/phase6_econometrics.json
      - artefacts/governance/preregistration_cef1a3b9a6811d7bde1afc92a2a9503f.json
      - data/pit_store
      - conf/model/volatility.yaml
      - conf/model/adequacy.yaml
      - conf/validation/default.yaml
    outs:
      - artefacts/governance/phase6_h1_competition.json:
          cache: false
      - reports/GARCH_VS_EWMA_COMPETITION.md:
          cache: false

  phase6_h2_regime_benchmark:
    cmd: python apps/run_regime_benchmark.py
    deps:
      - apps/run_regime_benchmark.py
      - src/tradebot/validation/regime_benchmark.py
      - src/tradebot/validation/sharpe_difference.py
      - src/tradebot/regime/buckets.py
      - src/tradebot/regime/markov.py
      - src/tradebot/regime/student_t.py
      - src/tradebot/regime/conditioning.py
      - src/tradebot/backtest/regime_overlay.py
      - src/tradebot/backtest/phase5_baseline.py
      - src/tradebot/reporting/phase6_regime_benchmark.py
      - src/tradebot/data/phase6_universe.py
      - artefacts/governance/phase6_data_adequacy.json
      - artefacts/governance/preregistration_3d3af28730a6c7f9da48d13139522a05.json
      - data/pit_store
      - conf/model/regime.yaml
      - conf/model/adequacy.yaml
      - conf/risk/default.yaml
      - conf/execution/fees.yaml
      - conf/execution/impact.yaml
      - conf/validation/default.yaml
    outs:
      - artefacts/governance/phase6_h2_regime_benchmark.json:
          cache: false
      - reports/M0_VS_HMM_BENCHMARK.md:
          cache: false

  # H3 leest de HYPOTHESIS-LEDGER en drukt `M` in zijn rapport af. Die staat
  # daarom in `deps`: verandert `M`, dan verandert de uitvoer, en een stage die
  # dat niet weet meldt "up to date" terwijl een herdraai iets anders oplevert.
  # `phase6_h2_regime_benchmark` mist die dep en heeft hetzelfde probleem; dat
  # staat als bevinding in het exit-rapport in plaats van dat het hier
  # stilzwijgend wordt meegerepareerd -- H2 opnieuw laten draaien is een besluit
  # en geen bijvangst van deze stage.
  phase6_h3_meta_labeling:
    cmd: python apps/run_meta_labeling.py
    deps:
      - apps/run_meta_labeling.py
      - src/tradebot/train/meta_label.py
      - src/tradebot/validation/meta_label_campaign.py
      - src/tradebot/validation/feature_importance.py
      - src/tradebot/labeling/phase6_barriers.py
      - src/tradebot/backtest/regime_overlay.py
      - src/tradebot/backtest/phase5_baseline.py
      - src/tradebot/backtest/baseline_runner.py
      - src/tradebot/features/registry.py
      - src/tradebot/features/microstructure.py
      - src/tradebot/reporting/phase6_meta_labeling.py
      - src/tradebot/data/phase6_universe.py
      - artefacts/governance/phase6_data_adequacy.json
      - artefacts/governance/hypothesis_ledger.json
      - artefacts/governance/preregistration_56395fa2013768014c0c915edf346770.json
      - data/pit_store
      - conf/model/meta_label.yaml
      - conf/model/labeling.yaml
      - conf/model/alpha.yaml
      - conf/model/volatility.yaml
      - conf/features/default.yaml
      - conf/data/default.yaml
      - conf/backtest/default.yaml
      - conf/risk/default.yaml
      - conf/execution/fees.yaml
      - conf/execution/impact.yaml
      - conf/validation/default.yaml
    outs:
      - artefacts/governance/phase6_h3_meta_labeling.json:
          cache: false
      - reports/META_LABELING_EVALUATION.md:
          cache: false
