# requirements-security.lock — de SAST- en CVE-scanners, gepind.
#
# Waarom dit bestand bestaat, en waarom het een DERDE lockfile is.
#
# `.github/workflows/security-scan.yml` installeerde `bandit[toml]` en
# `pip-audit` ongepind. Dat is dezelfde fout als DI-16: de releasedatum van de
# scanner bepaalt dan het oordeel, en een poort die van mening verandert zonder
# dat de code verandert, bewaakt niets. Voor ruff en mypy is dat in Phase 7/8
# gesloten met `requirements-dev.lock`; voor de scanners stond het open.
#
# WAAROM NIET IN requirements-dev.lock
# ====================================
# Gemeten 2026-09-18 met `pip install --dry-run` tegen de referentie-venv: de
# twee scanners voegen 15 pakketten toe en botsen met NUL bestaande pin. Ze
# passen er dus technisch prima in. Ze horen er alleen inhoudelijk niet:
# `requirements-dev.lock` pint de keten die het BEWIJS produceert -- pytest,
# hypothesis, mypy, ruff -- en die keten wordt door zes workflows en door elke
# ontwikkelaar geinstalleerd. Vijftien extra pakketten in elke job, voor een
# scanner die wekelijks draait en niets meet aan het bewijs, maakt de omgeving
# die het bewijs draagt groter zonder hem beter te maken.
#
# Dit is GEEN tweede pin-mechanisme (R-3). Het is hetzelfde mechanisme -- een
# lockfile met exacte pins -- met een eigen scope, precies zoals
# `requirements-dev.lock` zich verhoudt tot `requirements.lock`.
#
# HERGENEREREN
# ============
#     python -m venv /tmp/secvenv
#     /tmp/secvenv/bin/python -m pip install --dry-run --report r.json \
#         "bandit[toml]" pip-audit
#     # de `install`-lijst uit r.json, als naam==versie, gesorteerd
#
