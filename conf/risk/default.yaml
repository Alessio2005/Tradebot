# conf/risk/default.yaml — L7 institutioneel risicobudget
#
# BINDEND (audit sectie 14): risicobeheer is het soevereine controle-orgaan van
# het handelssysteem. Risico overruled altijd Alpha.
#
# Dit bestand is sinds Phase 4 de ENIGE bron van waarheid voor elke
# risicodrempel. Vóór deze fase stond `max_gross_leverage` op vijf plaatsen met
# vier verschillende waarden (1.5 / 2.0 / 4.0), en `dd_breaker_threshold` op
# vier plaatsen met vier waarden (0.15 / 0.18 / 0.20 / 0.35). Zie
# `reports/phase4_entanglement_map.md` sectie 5.
#
# ===========================================================================
# MANDAATWIJZIGING — EIGEN KAPITAAL, GEEN PROPFIRM
# ===========================================================================
# Tot deze commit gold de fase-4-regel "WAAR WAARDEN UITEENLIEPEN IS DE
# STRENGSTE GEKOZEN", en daarbovenop een propfirm-contract dat de dag- en
# drawdownlijnen dicteerde (de propfirm-audit, verwijderd op 2026-09-26:
# statisch 10% max-DD + 5% daily, intern gebufferd naar 6%/4,5%).
#
# Er wordt niet meer met propfirms gewerkt. Daarmee vervalt de grond onder elke
# drempel die contractnaleving was in plaats van een risico-oordeel. De
# volledige verantwoording per limiet — welke drempel het propfirm-mandaat
# werkelijk zette, welke uit de interne "strengste wint"-opruiming kwam, en
# welke een marktfeit is dat NIET mag verruimen — staat in `docs/RISK_MANDATE.md`.
# Lees dat document voordat je hier een getal wijzigt.
#
# Drie dingen die deze wijziging NIET doet, en die niemand erin mag lezen:
#   1. Zij creëert geen edge. Break-even is 16,3 (ETH) tot 57,8 (DOT) bps per
#      round trip; de beste gemeten bruto-edge in deze repo is +4,43 bps. Een
#      negatieve verwachting harder inzetten vergroot die verwachting niet.
#   2. Zij verruimt geen drempel omdat een resultaat tegenviel. De grond is een
#      exogeen gewijzigd mandaat; zie RISK_MANDATE §5.1.
#   3. Zij raakt `adv_participation_cap` niet. Dat is liquiditeit, geen
#      bereidheid; zie RISK_MANDATE §1 soort C.
#
# Gevalideerd tegen `schemas/config.py::RiskConfig` (extra="forbid", frozen).
# @package _global_
risk:

  # ── L7 Unconditional Volatility Targeting (audit sectie 14.1) ─────────────
  #     w_t = min( max_leverage , sigma_target / sigma_hat_{t+1|t} )
  #
  # sigma_hat komt uit L2 (`volatility/ewma.py`, lambda=0.94). Bij een
  # ontbrekende of niet-eindige sigma_hat crasht `risk/vol_targeting.py`. Er is
  # geen laatste-bekende-waarde en geen constante vol.
  #
  # sigma_target: de twee bestaande waarden waren 0.08 (conf_config.yaml, het
  #   pad dat backtest_portfolio.py feitelijk draaide) en 0.12
  #   (risk/portfolio.py constructordefault). Tot deze commit stond hier de
  #   strengste van die twee.
  #
  #   MANDAATWIJZIGING: 0.08 -> 0.20. Dit is een eigen-kapitaaltarget en geen
  #   propfirm-lijn (RISK_MANDATE §1, soort B). 0.20 geannualiseerd is bij
  #   annualisation_factor=365 ongeveer 1,05% per dag.
  #
  #   LET OP — DIT GETAL IS MOGELIJK INERT, EN DAT IS EEN OPEN DEFECT.
  #   `reports/vol_target_sweep.csv` laat `realized_vol` IDENTIEK 0.0742 zien bij
  #   target_vol 0.16, 0.24 EN 0.35 (sides=A). Een target die over een factor
  #   twee dezelfde gerealiseerde vol oplevert, bindt niet: er zit een andere
  #   limiet vóór. Die sweep draaide met risicoparameters BUITEN conf/ om
  #   (miscellaneous/run_hrp_backtest.py), dus 0.0742 is geen eigenschap van
  #   deze config — maar wie verwacht dat 0.20 het boek 2,5x groter maakt, moet
  #   dat METEN. Zie RISK_MANDATE §2.3 en fase 9 §6.3 kandidaat A.
  sigma_target: 0.20

  # max_leverage: bestaande waarden 1.5 / 2.0 / 4.0. Dit is de cap op de
  #   vol-targeting SCALAR, niet op de som van de posities; die staat hieronder
  #   als gross_cap.
  #
  #   MANDAATWIJZIGING: 1.5 -> 4.0, de ruimste waarde die vóór de fase-4-
  #   consolidatie in de repo stond; `conf/conf_config.yaml:116` draagt hem nog
  #   als `max_portfolio_leverage_bidir`. Bindt pas bij sigma_hat < 0.05
  #   geannualiseerd, wat op dit universum niet voorkomt — de vol-target hoort
  #   dus normaal te binden (zie de waarschuwing hierboven).
  max_leverage: 4.0

  # ── Harde limieten (audit sectie 14.1) ────────────────────────────────────
  # max_position_pct: absolute exposure-cap per asset.
  #
  #   MANDAATWIJZIGING: 0.25 -> 0.80 (RISK_MANDATE §1, soort B). De waarde is
  #   zó gekozen dat gross_cap BLIJFT BINDEN: 6 symbolen x 0.80 = 4.8 > 4.0.
  #   Was hij 0.50 gebleven, dan was 6 x 0.50 = 3.0 < 4.0 en had gross_cap
  #   nooit meer gebonden — een limiet die niet bindt is documentatie.
  max_position_pct: 0.80

  # max_concentration: maximale fractie van de gross exposure in één asset.
  #   Bestaande waarden: 0.80 (risk/position_limits.py) en 0.40
  #   (portfolio/constraints.py, live/portfolio_controller.py). Strengste.
  #
  #   ONGEWIJZIGD BIJ DE MANDAATWIJZIGING, EN DAT IS EEN BESLUIT. Deze drempel
  #   is nooit propfirm-afgeleid geweest, dus het wegvallen van het contract
  #   levert geen grond om hem te verruimen. Volgens AD-4 is hij bovendien de
  #   ENIGE werkzame spreidingsbescherming op dit universum, omdat cluster_cap
  #   hieronder vacuous is. Hij bindt onder boek-gross ~2.0; daarboven neemt
  #   max_position_pct het over (RISK_MANDATE §3).
  max_concentration: 0.40

  # max_cluster_concentration: idem per sector/cluster. Nieuw in Phase 4 — er
  #   bestond geen clusterlimiet, terwijl een crypto-boek per constructie in
  #   één cluster kan belanden zodra correlaties naar 1 gaan (scenario S2).
  #
  #   ONGEWIJZIGD BIJ DE MANDAATWIJZIGING: verruimen verandert niets, want deze
  #   limiet is vacuous op dit universum (AD-4, en zie de toelichting bij
  #   `clusters` onderaan). Hij blijft staan om weer te gaan werken zodra er een
  #   tweede AANTOONBAAR cluster bijkomt.
  max_cluster_concentration: 0.60

  # gross_cap: max sum(|w_i|). Bestaande waarden 1.5 / 2.0 / 4.0.
  #
  #   MANDAATWIJZIGING: 1.5 -> 4.0 (RISK_MANDATE §1, soort B). Zelfde grond als
  #   max_leverage: de ruimste waarde die al in de repo bestond.
  gross_cap: 4.0

  # net_cap: max |sum(w_i)|, absoluut. De oude formulering was een FRACTIE van
  #   de gross (max_net_imbalance = 0.40); die is omgezet naar een absolute cap
  #   zodat de limiet niet meebeweegt met de gross en dus niet ruimer wordt
  #   naarmate het boek groter is. Dat blijft zo.
  #
  #   MANDAATWIJZIGING: 0.60 -> 2.0, dat is 0.50 x gross in plaats van
  #   0.40 x gross. De reden is niet bereidheid maar MEETBAARHEID:
  #
  #   Funding carry — de enige niet-gefalsificeerde kandidaat uit fase 9 §6.3 —
  #   is per constructie DIRECTIONEEL. Bij positieve funding betalen leveraged
  #   longs de shorts, dus de positie die de carry ontvangt is systematisch
  #   short. Een netto-cap van 0.40 x gross duwt het boek richting
  #   marktneutraal en snijdt precies de exposure weg die het mechanisme
  #   oplevert. 2.0 laat een volledig directioneel boek van 2.0 toe en blijft
  #   een ONAFHANKELIJKE limiet: een ongehedged boek van 4.0 blijft verboden.
  net_cap: 2.0

  # adv_participation_cap: per-asset positielimiet afgeleid van liquiditeit,
  #   als fractie van de Average Daily Volume. 1% is de waarde die
  #   risk/portfolio.py zelf al als aanbeveling documenteerde maar nooit
  #   afdwong (`max_adv_fraction=None`).
  #
  #   ONGEWIJZIGD BIJ DE MANDAATWIJZIGING, EN DAT IS GEEN NALATIGHEID.
  #   Dit is geen risicobereidheid maar een MARKTFEIT (RISK_MANDATE §1,
  #   soort C). Boven ~1% van de ADV is de impactterm geen correctie meer maar
  #   het hele resultaat, en `conf/execution/impact.yaml` staat op
  #   IMPACT_UNCALIBRATED. Deze cap verruimen is niet moediger worden; het is
  #   de backtest laten rekenen met fills die niet bestaan, en het vervalst de
  #   kostenkant van ELKE meting — inclusief de 16,3-57,8 bps break-even
  #   waaraan elke kandidaat wordt getoetst.
  adv_participation_cap: 0.01

  # ── Kill switches (audit sectie 14.1) ─────────────────────────────────────
  # Drawdown Breaker op High-Water Mark, met GETRAPTE de-grossing. Vóór Phase 4
  # was elke breaker binair: hij deed niets tot de eindlimiet en zette dan
  # alles op nul. De trappen grijpen in waar dat nog goedkoop is.
  #
  # `drawdown` loopt strikt op, `gross_multiplier` strikt af — afgedwongen door
  # RiskConfig._tiers_are_monotone.
  #
  # MANDAATWIJZIGING: 0.04/0.06 -> 0.12/0.18, geschaald op de nieuwe halt van
  # 0.25 (RISK_MANDATE §1, soort A). De trappen bestonden om de PROPFIRM-lijn
  # onaangeroerd te laten; die lijn is er niet meer. De VORM blijft: getrapt,
  # monotoon, en strikt onder max_drawdown_pct.
  drawdown_breaker_levels:
    - drawdown: 0.12
      gross_multiplier: 0.60
    - drawdown: 0.18
      gross_multiplier: 0.30

  # max_drawdown_pct: de harde grens. Hierboven is het geen de-grossing meer
  #   maar een HALT, en die is onherroepelijk tot een handmatige reset.
  #   Bestaande waarden 0.08 (conf/risk, conf/env/prod) / 0.15 / 0.18 / 0.20 /
  #   0.35.
  #
  #   MANDAATWIJZIGING: 0.08 -> 0.25. Dit is een RUINELIJN, geen comfortlijn.
  #   Twee metingen zetten het getal vast, van onderen en van boven:
  #
  #   VAN ONDEREN — 0.08 was niet meetbaar. De enige echte forward-meting in de
  #     repo heeft max_drawdown = -0.3817 (reports/adaptive_wf_metrics.json,
  #     forward_sharpe 0.688, pbo 0.222). Een hard halt op 0.08 beeindigt dat
  #     pad onherroepelijk ver voordat het venster uit is. Een kandidaat die
  #     zo'n pad reproduceert is onder het oude budget niet "te riskant" — hij
  #     is NIET TE METEN. Dat is een meetfout met een risicomotivering.
  #
  #   VAN BOVEN — 0.30 is een hard plafond. `risk/stress_test.py:68` zet
  #     GAP_DOWN_FRACTION = 0.30 en
  #     `tests/integration/test_risk_overrules_alpha.py:203` eist dat die schok
  #     de halt TRIPT. Boven 0.30 wordt het S3-scenario non-bindend en toetst de
  #     stress-suite niets meer. 0.25 laat het scenario werken met 5 punten
  #     marge.
  #
  #   Wat hieruit volgt en niet verzwegen mag worden: het enige forward-gemeten
  #   pad in deze repo breekt OOK door 0.25 heen. Dat is opzet — een strategie
  #   die de ruinelijn raakt hoort te stoppen. Het verschil met 0.08 is dat zij
  #   nu eerst gemeten kan worden.
  max_drawdown_pct: 0.25

  # daily_loss_limit: Daily Loss Governor — onmiddellijke kill switch op het
  #   verlies sinds de openingsequity van de dag. Geen trappen: de governor is
  #   binair van aard.
  #
  #   MANDAATWIJZIGING: 0.03 -> 0.10 (RISK_MANDATE §1, soort A). Dit was de
  #   zuiverste propfirm-drempel in dit bestand: een buffer onder de firmalijn
  #   van 5%, en niets anders.
  #
  #   WAAROM DIT GEEN 3,3x MEER RISICO IS. Bij het OUDE sigma_target draaide het
  #   boek op 0.0742 geannualiseerd (reports/vol_target_sweep.csv), dat is
  #   0.0742/sqrt(365) = 0,388% per dag (1 sigma). De oude limiet van 3% was
  #   daarmee 7,7 DAGELIJKSE SIGMA en vuurde onder normale variantie nooit. Hij
  #   vuurde uitsluitend op een SPRONG — en conf/data/default.yaml accepteert
  #   |log-return| tot 0.35 (~ +42%/-30%) expliciet als echte marktbeweging.
  #   De governor is dus altijd een gap-risicolijn geweest en nooit een
  #   variantielijn. 0.10 is dezelfde functie (containment van een sprong, een
  #   bug of een runaway-loop) zonder de contractbuffer die geen doel meer heeft.
  daily_loss_limit: 0.10

  # ── Overig ────────────────────────────────────────────────────────────────
  # daily_var_limit_pct: MANDAATWIJZIGING 0.02 -> 0.05. Houdt de verhouding uit
  #   de propfirm-audit §4.3 vast ("1-dags 99%-ES < 0.5 x daily-limit"),
  #   nu tegen de nieuwe daglimiet: 0.5 x 0.10 = 0.05.
  daily_var_limit_pct: 0.05

  # max_position_age_h: MANDAATWIJZIGING 48 -> 720 (30 dagen). DIT IS DE LIMIET
  #   MET HET GROOTSTE MEETBARE GEVOLG VAN DEZE HELE COMMIT.
  #
  #   Fase 9 §6.3 houdt drie kandidaten over; alleen kandidaat B (funding carry)
  #   koppelt volatiliteitsmodellering aan een verdienmechanisme in plaats van
  #   aan een noemer, en hij is NIET gefalsificeerd — hij is niet gedraaid.
  #
  #   De rekensom uit die paragraaf: ETH-carry ~ 6.5e-5 per 8h in de all-bucket
  #   (~0,65 bps per 8h ~ 1,95 bps/dag) tegen 13,0 bps VASTE kosten per round
  #   trip. Bij 1,95 bps/dag duurt het ruim ZEVEN DAGEN voordat alleen die vaste
  #   kosten zijn terugverdiend, impact niet meegerekend.
  #
  #   Een flatten na 48 uur GARANDEERDE dus dat de enige overgebleven kandidaat
  #   zijn kosten niet kon terugverdienen, en dat elke meting eraan negatief zou
  #   uitvallen om een reden die niets met de markt te maken heeft. Een
  #   gefalsificeerde kandidaat B onder die limiet was een artefact van deze
  #   config geweest, geen marktuitspraak — precies wat fase 9 §0 regel 5
  #   verbiedt (een niet-uitgevoerde meting is geen negatieve meting).
  #
  #   720 uur is ruim genoeg om de houdduur te vinden waarbij
  #   carry - kosten - prijsdrift > 0, of om vast te stellen dat die niet
  #   bestaat. Dat laatste blijft een volwaardig resultaat (fase 9 §9), maar het
  #   moet uit de data komen en niet uit een propfirm-flattenregel.
  #
  #   OPENSTAAND: `live/circuit_breaker.py:85` draagt een eigen code-default van
  #   48 en `apps/live_paper_trader.py:296` geeft 48 hardcoded door. Dat is de
  #   constructie die RISK_CONTRACT §8 verbiedt. Zie RISK_MANDATE §6 punt 2.
  max_position_age_h: 720

  # Sector/cluster-labels voor max_cluster_concentration.
  #
  # PHASE 5 CORRECTIE. Tot deze fase droegen vijf symbolen `crypto_l1` en droeg
  # LINKUSDT `crypto_oracle`. Die indeling is gemeten en verworpen; het volledige
  # bewijs staat in `reports/phase5_cluster_concentration_audit.md`. Kort:
  #
  #   * de scheiding tussen de twee groepen is +0,0113 met een bootstrap
  #     95%-BI van [-0,0131, +0,0380] - het interval bevat nul;
  #   * het teken WISSELT per jaar; in 2025 en 2026 is `crypto_l1` sterker
  #     gecorreleerd met LINKUSDT dan met zichzelf;
  #   * jaarlijks herhaalde clustering levert zes verschillende partities in
  #     zes jaar op.
  #
  # Het gevolg was pervers: de clusterlimiet duwde LINKUSDT van 16,7 % naar
  # 40,0 % van het boek - exact op `max_concentration` - en vernietigde daarbij
  # 58 % van de bruto-exposure. Een diversificatiebeperking die het meest
  # geconcentreerde toegestane boek produceert.
  #
  # De labels zijn daarom gecorrigeerd naar wat gemeten is: EEN cluster. Zes
  # crypto-perpetuals met een gemiddelde paarsgewijze correlatie van 0,735
  # vormen een economische groep; elke tweedeling ervan is een fit op ruis.
  #
  # DIT MAAKT DE LIMIET VACUOUS, EN DAT MOET GEZEGD WORDEN. Bij een cluster
  # geldt `effective_relative_cap(1, 0.60) = max(0.60, 1/1) = 1.0`, dus
  # `cluster_cap` bindt nooit meer op dit universum. Hij blijft in
  # `constraint_order` en wordt weer actief zodra er een tweede AANTOONBAAR
  # cluster bijkomt - aandelen, FX of grondstoffen. Tot dat moment is
  # `max_concentration` (0,40) de enige werkzame spreidingsbescherming.
  # Bewaakt door `tests/integration/test_cluster_feasibility.py`.
  clusters:
    BTCUSDT:  crypto_perp
    ETHUSDT:  crypto_perp
    SOLUSDT:  crypto_perp
    AVAXUSDT: crypto_perp
    DOTUSDT:  crypto_perp
    LINKUSDT: crypto_perp

  # Toepassingsvolgorde. Expliciet geconfigureerd, nooit impliciet in de
  # code-volgorde (Phase 4, stap 4). Zie docs/RISK_CONTRACT.md sectie 6:
  # de boekbrede caps staan als LAATSTE, want alleen dan geldt hun garantie
  # onvoorwaardelijk. Een limiet die hier ontbreekt wordt niet stilzwijgend
  # overgeslagen — de engine crasht.
  constraint_order:
    - halted
    - daily_loss_governor
    - drawdown_breaker
    - vol_target
    - per_asset_cap
    - adv_cap
    - concentration_cap
    - cluster_cap
    - gross_cap
    - net_cap

  # 1/N is de BASELINE, Inverse Volatility (Naive Risk Parity) is de PRODUCTION
  # DEFAULT (audit sectie 13.1). HRP, Markowitz en Black-Litterman zijn in
  # Phase 3 expliciet niet toegestaan.
  allocator: risk_parity
