# conf/research/preregistration_h1_garch_vs_ewma.yaml
# PRE-REGISTRATIE H1 — Level 2 GARCH-familie tegen Level 1 EWMA(0.94).
#
# Bevroren door `apps/freeze_phase6_preregistrations.py`, dat de gecertificeerde
# data_hashes, de parameterruimte uit `conf/` én de power-analyse eraan koppelt
# en er een onveranderlijke `preregistration_id` uit afleidt.
#
# `parameters` staat hier BEWUST NIET: de ruimte komt uit conf/model/volatility.yaml,
# conf/model/adequacy.yaml en conf/validation/default.yaml.
#
# ===========================================================================
# POWER-ANALYSE — VOOR DE RUN, NIET ERNA (§3, exit-criterium 10)
# ===========================================================================
# Toets: Diebold-Mariano op het per-bar QLIKE-verschil, met de
# Harvey-Leybourne-Newbold-correctie voor kleine steekproeven.
#
# Effectieve steekproefgrootte:
#
#   OOS-bars per symbool             1.200   (12 folds × 100 test-bars)
#   × effectief aantal reeksen        1,265  (6 / (1 + 5 × 0,7485); de
#                                             gemiddelde paarsgewijze correlatie
#                                             van 0,7485 is GEMETEN op dit
#                                             universum, niet aangenomen)
#   ÷ seriële design effect        1,00-2,33  (afhankelijk van de AR(1) in de
#                                             verliesverschilreeks; dit is de
#                                             enige onbekende in de berekening)
#
#   n_eff = 1.518 (AR1 = 0,0) · 1.012 (AR1 = 0,2) · 651 (AR1 = 0,4)
#
# Minimaal detecteerbaar effect bij alpha = 0,05 tweezijdig en 80 % power,
# uitgedrukt in standaarddeviaties van de per-bar QLIKE-verschilreeks:
#
#   MDE = (z_0,025 + z_0,80) / sqrt(n_eff) = 2,8016 / sqrt(n_eff)
#
#       AR1 = 0,0  ->  MDE = 0,072 SD
#       AR1 = 0,2  ->  MDE = 0,088 SD
#       AR1 = 0,4  ->  MDE = 0,110 SD
#
# VERWACHT EFFECT: 0,10 SD. Hansen & Lunde (2005) vonden over 330 modellen op
# wisselkoersen en aandelen dat vrijwel niets een GARCH(1,1) verslaat; de winst
# van GARCH boven RiskMetrics-EWMA is in de literatuur consistent klein en
# vaak niet significant. 0,10 SD is een genereuze bovengrens.
#
# OORDEEL VOORAF: deze toets is MARGINAAL informatief. Zij ziet het verwachte
# effect wanneer de QLIKE-verschilreeks weinig seriële correlatie heeft
# (AR1 <= ~0,3) en ziet het NIET wanneer die correlatie hoger ligt. De
# feitelijke AR(1) wordt na de run gerapporteerd naast deze drie scenario's;
# blijkt zij boven 0,3 te liggen, dan is een niet-significante uitkomst
# `UNPROVEN` en NIET `FALSIFIED`.
#
# ===========================================================================
# DE RV-PROXY — DE ANDERE BEPERKING, OOK VOORAF VASTGELEGD
# ===========================================================================
# QLIKE vergelijkt een variantieforecast met een PROXY voor de gerealiseerde
# variantie. De gecertificeerde store bevat 0 rijen 1m/5m (Phase 1 scope-besluit,
# `docs/DATA_REGISTER.md`), dus de proxy is een DAILY RANGE-ESTIMATOR en geen
# realized variance uit intraday returns.
#
# Dat is legitiem — QLIKE is robuust tegen proxy-ruis zolang de proxy
# conditioneel zuiver is (Patton 2011), en de range-estimators zijn dat onder
# een driftloze GBM binnen de dag — maar de EFFICIENTIE is veel lager dan die
# van 5-minuts-RV. Concreet: de gekwadrateerde dagreturn heeft een
# proxy-variantie van ~2 × IV², Parkinson ~0,27 × IV². De ruis van de proxy
# vergroot de variantie van het QLIKE-verschil en verkleint dus de power
# hierboven verder. Dit staat vooraf genoteerd, zodat een niet-significante
# uitkomst niet achteraf aan de proxy kan worden toegeschreven of juist niet.
preregistration:
  wave: phase6_h1_garch_vs_ewma

  title: >-
    H1 — Level 2 GARCH-familie (GARCH, GJR, EGARCH, APARCH met Student-t
    innovaties) tegen de Level 1 EWMA(0.94) productie-estimator op QLIKE,
    out-of-sample onder Purged Walk-Forward.

  hypothesis: >-
    Minstens één lid van de Level 2 GARCH-familie levert op het gecertificeerde
    crypto-perpetueluniversum een LAGERE out-of-sample QLIKE dan de
    productie-estimator EWMA met lambda = 0.94, gemeten tegen een daily
    range-gebaseerde variantieproxy, en dat verschil is significant onder de
    Diebold-Mariano-toets met de Harvey-Leybourne-Newbold-correctie op
    alpha = 0.05, per symbool en per horizon.

  null_hypothesis: >-
    De verwachte QLIKE van elk lid van de GARCH-familie is groter dan of gelijk
    aan die van EWMA(0.94), zodat de vervanging van de productie-estimator geen
    voorspelverbetering oplevert. Onder deze nulhypothese blijft EWMA(0.94) de
    productie-estimator, ongeacht of de puntschatting van een GARCH-variant
    toevallig lager uitvalt. De nulhypothese wordt uitsluitend verworpen op een
    DM-HLN p-waarde onder 0.05 en NIET op een verschil in puntschattingen.

  universe:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - AVAXUSDT
    - LINKUSDT
    - DOTUSDT

  granularity: 1d

  period_start: "2020-03-26"
  period_end: "2026-08-23"

  # Eerste bar van het bruikbare venster: de doorsnede van de bars waarop de
  # EWMA-vol bestaat (60 bars burn-in) en de causale 30-daagse ADV bestaat.
  # 1.743 bars, identiek aan het venster van de Phase 5-herwaardering, zodat
  # elk Phase 6-resultaat op dezelfde data staat als de basislijn.
  evaluation_start: "2021-11-15"

  primary_metric: oos_qlike

  # 4 modellen (GARCH(1,1), GJR-GARCH, EGARCH, APARCH)
  #   × 6 symbolen
  #   × 2 horizonnen (h = 1 en h = 5 bars)
  #   = 48 trials.
  #
  # EWMA(0.94) telt NIET mee: lambda is niet gevarieerd, komt uit
  # conf/model/volatility.yaml en is de bestaande productie-estimator. Er wordt
  # dus geen ruimte doorzocht. De negatieve controle (EWMA tegen een geschudde
  # variant van zichzelf) telt evenmin mee: zij is een controle op de TOETS en
  # geen hypothese over de markt.
  #
  # Elke uitbreiding van deze ruimte vereist een NIEUWE pre-registratie en
  # verhoogt M opnieuw. Een vijfde modelvariant "omdat de eerste vier het niet
  # haalden" is de zet die pre-registratie uitsluit.
  planned_trials: 48

  data_series:
    - crypto/ohlcv/BTCUSDT/1d
    - crypto/ohlcv/ETHUSDT/1d
    - crypto/ohlcv/SOLUSDT/1d
    - crypto/ohlcv/AVAXUSDT/1d
    - crypto/ohlcv/LINKUSDT/1d
    - crypto/ohlcv/DOTUSDT/1d

  stop_criteria:
    - name: arch_gate_no_conditional_heteroskedasticity
      metric: engle_arch_p_value
      operator: ">="
      threshold: 0.05
      action: descope
      rationale: >-
        De Engle ARCH-toets is de poortwachter van dit spoor. Is er op een reeks
        geen aantoonbare conditionele heteroskedasticiteit, dan is een
        GARCH-structuur op die reeks niet gerechtvaardigd en wordt zij uit de
        competitie gehaald met een gedocumenteerd oordeel. Dat is de-scopen,
        geen falsificatie: het model is er niet slechter door gebleken, het is
        er niet van toepassing.

    - name: no_significant_qlike_improvement
      metric: dm_hln_p_value
      operator: ">="
      threshold: 0.05
      action: falsify
      rationale: >-
        Zonder verwerping van de DM-HLN-nulhypothese op 5 % is superioriteit
        niet vastgesteld en blijft EWMA(0.94) de productie-estimator. Dit is
        een compleet en publiceerbaar resultaat, geen aanleiding om horizonnen
        of verdelingsaannames toe te voegen tot er een significante uitkomst
        verschijnt. LET OP de interactie met het power-criterium hieronder: is
        de toets onderpowered gebleken, dan geldt `UNPROVEN` in plaats van
        `FALSIFIED`, want §6 verbiedt het falsificeren van een model dat
        simpelweg te weinig data had.

    - name: underpowered_test_cannot_falsify
      metric: measured_power_deficit
      operator: ">"
      threshold: 1.0
      action: descope
      rationale: >-
        Blijkt na de run dat het minimaal detecteerbare effect groter is dan het
        verwachte effect van 0,10 SD — bijvoorbeeld doordat de AR(1) van de
        verliesverschilreeks boven 0,3 ligt — dan kan deze opzet het effect niet
        zien en is een niet-significante uitkomst geen bewijs van afwezigheid.
        Het oordeel is dan `UNPROVEN — insufficient data` met de gemeten power
        erbij. Dit criterium bestaat om te voorkomen dat een onderpowerde toets
        als falsificatie wordt gepresenteerd.

    - name: convergence_too_low_to_compare
      metric: garch_convergence_ratio
      operator: "<"
      threshold: 0.90
      action: descope
      rationale: >-
        Convergeert minder dan 90 % van de fits van een variant, dan is de
        QLIKE-reeks van die variant een SELECTIE van de gemakkelijke vensters en
        niet vergelijkbaar met een estimator die overal een waarde geeft. De
        variant wordt met zijn convergentieratio gerapporteerd en uit de
        vergelijking gehaald. Niet-convergentie wordt geregistreerd, nooit
        weggevangen met een fallback naar EWMA.

    - name: promotion_requires_all_gates_clear
      metric: n_binding_stop_criteria
      operator: "<="
      threshold: 0.0
      action: promote
      rationale: >-
        Promotie van een GARCH-variant tot productie-estimator vereist dat GEEN
        van de bovenstaande criteria bindt: de ARCH-poort open, DM-HLN
        significant, de toets aantoonbaar gepowerd en de convergentie boven 90 %.
        Er bestaat geen afweging waarin twee zwakke uitkomsten samen een sterke
        vormen.
