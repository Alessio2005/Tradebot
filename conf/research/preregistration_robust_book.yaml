# conf/research/preregistration_robust_book.yaml
# PRE-REGISTRATIE — robuust boek v1 (beta, trend, carry en hun combinatie).
# Bevroren door `python -m tradebot.systematic.programme freeze`, VOOR de eerste
# kandidaat-run op echte data. `parameters` staat hier bewust niet: die worden bij
# het bevriezen uit conf/model/robust_book.yaml ingespoten.
# Ontwerp: docs/superpowers/specs/2026-10-07-robust-book-design.md.
#
# Elk stop-criterium hieronder wordt per kandidaat (C1..C5) geëvalueerd op W_DEV,
# behalve `gate_sharpe_collapse` en `gate_drawdown`, die alleen op de ene lezing van
# het poortsample binden. "Bindt" = de kandidaat haalt de poort NIET.
wave: robust_book_v1

title: >-
  Een vol-getarget boek uit drie economisch verschillende premies -- vol-gemanaged
  beta op BTC/ETH, symmetrisch tijdreeks-momentum over een vast lookbackraster en
  dollar-neutrale funding-carry -- en hun gelijk-risicocombinatie, op zes crypto-
  perpetuals op dagbars, netto van fees, spread, impact en funding.

hypothesis: >-
  Ten minste één van de vijf vooraf vastgelegde kandidaten (C1 trend long-short, C2
  trend long-flat, C3 vol-gemanaged kern, C4 funding-carry, C5 combinatie) haalt op
  W_DEV (2021-11-15 .. 2025-09-04) na alle kosten een netto Sharpe van ten minste 1,0
  en een netto CAGR van ten minste 15 % bij een portefeuille-volatiliteitsdoel van
  20 %, consistent over TRAIN en VALIDATE, robuust voor dubbele kosten, een dag
  vertraging en parameterverstoring, met een DSR van ten minste 0,95 bij M = 7 en een
  PBO onder 0,5, en houdt dat in de ene lezing van het poortsample (2025-09-05 ..
  2026-08-23) zonder significante ineenstorting vast.

null_hypothesis: >-
  Geen enkele kandidaat haalt die combinatie. De verwachting vooraf (prior, gebaseerd
  op 52 eerdere trials op deze zes munten) is een netto Sharpe van 0,3 tot 0,7: met
  een effectieve breedte van ongeveer 1,3 onafhankelijke weddenschappen is een
  Sharpe van 1 op deze data niet aantoonbaar. Een positief resultaat op een andere
  kandidaat dan die met de hoogste vooraf gedefinieerde robuustheidsscore weerlegt de
  nulhypothese niet: dat zou selectie zijn.

universe: [BTCUSDT, ETHUSDT, SOLUSDT, AVAXUSDT, LINKUSDT, DOTUSDT]
granularity: 1d
period_start: "2020-03-26"
period_end: "2026-08-23"
evaluation_start: "2021-11-15"
primary_metric: net_sharpe_w_dev

# B1, B2 (referenties) en C1..C5 (kandidaten).
planned_trials: 7

data_series:
  - crypto/ohlcv/BTCUSDT/1d
  - crypto/ohlcv/ETHUSDT/1d
  - crypto/ohlcv/SOLUSDT/1d
  - crypto/ohlcv/AVAXUSDT/1d
  - crypto/ohlcv/LINKUSDT/1d
  - crypto/ohlcv/DOTUSDT/1d
  - crypto/funding/BTCUSDT/8h
  - crypto/funding/ETHUSDT/8h
  - crypto/funding/SOLUSDT/8h
  - crypto/funding/AVAXUSDT/8h
  - crypto/funding/LINKUSDT/8h
  - crypto/funding/DOTUSDT/8h
  - crypto/open_interest/BTCUSDT/1d
  - crypto/open_interest/ETHUSDT/1d
  - crypto/open_interest/SOLUSDT/1d
  - crypto/open_interest/AVAXUSDT/1d
  - crypto/open_interest/LINKUSDT/1d
  - crypto/open_interest/DOTUSDT/1d

stop_criteria:
  - name: g1_sharpe_below_target
    metric: net_sharpe_w_dev
    operator: "<"
    threshold: 1.0
    action: archive
    rationale: De opdracht vraagt een netto Sharpe van ten minste 1,0.
  - name: g2_cagr_below_target
    metric: net_cagr_w_dev
    operator: "<"
    threshold: 0.15
    action: archive
    rationale: >-
      De opdracht vraagt een netto CAGR van ten minste 15 %, bij het vaste vol-doel van
      20 %: de doelstelling halen met extra hefboom is uitdrukkelijk uitgesloten.
  - name: g3_train_inconsistent
    metric: net_sharpe_train
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Een edge die alleen in één helft van W_DEV bestaat, is een regime, geen edge.
  - name: g3_validate_inconsistent
    metric: net_sharpe_validate
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Idem, voor de tweede helft.
  - name: g4_drawdown
    metric: max_drawdown_w_dev
    operator: ">"
    threshold: 0.25
    action: archive
    rationale: Mandaatgrens conf/risk/default.yaml::max_drawdown_pct.
  - name: g5_cost_fragile
    metric: sharpe_ratio_2x_cost_over_base
    operator: "<"
    threshold: 0.75
    action: archive
    rationale: Bij dubbele kosten moet minstens 75 % van de Sharpe overblijven.
  - name: g5_delay_fragile
    metric: sharpe_ratio_lag2_over_base
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Eén dag vertraging mag de Sharpe niet meer dan halveren.
  - name: g6_no_plateau
    metric: plateau_fraction
    operator: "<"
    threshold: 0.8
    action: archive
    rationale: >-
      Minstens 80 % van de parameterverstoringen moet meer dan de helft van de
      basis-Sharpe houden; anders staat de kandidaat op een piek, niet op een plateau.
  - name: g6_negative_perturbation
    metric: min_perturbation_sharpe
    operator: "<"
    threshold: 0.0
    action: archive
    rationale: Geen enkele redelijke parameterverstoring mag de Sharpe negatief maken.
  - name: g7_interval_includes_zero
    metric: sharpe_ci_low_w_dev
    operator: "<="
    threshold: 0.0
    action: archive
    rationale: De circulaire-blokbootstrap-ondergrens (95 %) moet boven nul liggen.
  - name: g8_dsr_below_threshold
    metric: dsr_w_dev
    operator: "<"
    threshold: 0.95
    action: archive
    rationale: Onder DSR 0,95 bij M = 7 is de Sharpe niet te onderscheiden van selectieruis.
  - name: g9_overfit_probability
    metric: pbo
    operator: ">="
    threshold: 0.5
    action: archive
    rationale: Een PBO van 0,5 of meer betekent dat de beste in-sample variant out-of-sample meestal onder de mediaan valt.
  - name: gate_sharpe_collapse
    metric: gate_sharpe_z_vs_dev
    operator: "<"
    threshold: -1.645
    action: falsify
    rationale: >-
      Eén lezing van het poortsample: valt de Sharpe daar eenzijdig significant (5 %)
      onder de W_DEV-schatting, dan is de backtest-Sharpe niet te reproduceren.
  - name: gate_drawdown
    metric: max_drawdown_gate
    operator: ">"
    threshold: 0.25
    action: falsify
    rationale: Ook in het poortsample geldt de mandaatgrens.
  - name: promotion_requires_all_clear
    metric: n_binding_stop_criteria
    operator: "<="
    threshold: 0
    action: promote
    rationale: Papertrading vereist dat geen enkel criterium hierboven bindt.
