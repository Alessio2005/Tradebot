# conf/research/preregistration_robust_book_v3.yaml
# PRE-REGISTRATIE -- robuust boek v3: v2 met een gecorrigeerd spreadmodel (3 bp) en
# partiële aanpassing (kappa 0,2). POST-HOC na v2 en zo geboekt (M = 17).
# Bevroren door `python -I -m tradebot.systematic.programme_v3 freeze`, vóór de eerste
# v3-run. Ontwerp: docs/superpowers/specs/2026-10-07-robust-book-v3-costs-design.md.
wave: robust_book_v3_costs

title: >-
  Funding-carry en trend long-flat op de point-in-time top-50 van Binance USDT-M, en hun
  gelijk-risicocombinatie, met een vaste halve spread van 3 bp en Garleanu-Pedersen
  partiele aanpassing, netto van fees, spread, impact en funding.

hypothesis: >-
  Met een realistisch spreadmodel en een omzet die bij het signaalverval past, haalt ten
  minste een van Y2 (carry), Y4 (trend long-flat) of Y5 (hun combinatie) op W_DEV een netto
  Sharpe van ten minste 1,0 en een netto CAGR van ten minste 15 % bij 20 % vol, consistent
  over TRAIN en VALIDATE, robuust voor kosten, vertraging en parameterverstoring, met DSR
  0,95 bij M = 17 en PBO onder 0,5, en houdt dat in de holdout zonder ineenstorting vast.

null_hypothesis: >-
  De bruto edge van carry en trend op deze munten overleeft ook realistische kosten niet in
  de vereiste mate, of alleen in een deel van de periode. Een positief resultaat op een
  andere kandidaat dan de hoogst scorende weerlegt de nulhypothese niet.

universe: [BINANCE_USDT_M_TOP50_PIT]
granularity: 1d
period_start: "2020-01-01"
period_end: "2026-09-30"
evaluation_start: "2021-01-01"
primary_metric: net_sharpe_w_dev

planned_trials: 3

data_series:
  - binance_um/klines/1d
  - binance_um/fundingRate

stop_criteria:
  - name: g1_sharpe_below_target
    metric: net_sharpe_w_dev
    operator: "<"
    threshold: 1.0
    action: archive
    rationale: De opdracht vraagt een netto Sharpe van ten minste 1,0.
  - name: g2_cagr_below_target
    metric: net_cagr_w_dev
    operator: "<"
    threshold: 0.15
    action: archive
    rationale: >-
      De opdracht vraagt een netto CAGR van ten minste 15 %, bij het vaste vol-doel van
      20 %: de doelstelling halen met extra hefboom is uitdrukkelijk uitgesloten.
  - name: g3_train_inconsistent
    metric: net_sharpe_train
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Een edge die alleen in één helft van W_DEV bestaat, is een regime, geen edge.
  - name: g3_validate_inconsistent
    metric: net_sharpe_validate
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Idem, voor de tweede helft.
  - name: g4_drawdown
    metric: max_drawdown_w_dev
    operator: ">"
    threshold: 0.25
    action: archive
    rationale: Mandaatgrens conf/risk/default.yaml::max_drawdown_pct.
  - name: g5_cost_fragile
    metric: sharpe_ratio_2x_cost_over_base
    operator: "<"
    threshold: 0.75
    action: archive
    rationale: Bij dubbele kosten moet minstens 75 % van de Sharpe overblijven.
  - name: g5_delay_fragile
    metric: sharpe_ratio_lag2_over_base
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Eén dag vertraging mag de Sharpe niet meer dan halveren.
  - name: g6_no_plateau
    metric: plateau_fraction
    operator: "<"
    threshold: 0.8
    action: archive
    rationale: >-
      Minstens 80 % van de parameterverstoringen moet meer dan de helft van de
      basis-Sharpe houden; anders staat de kandidaat op een piek, niet op een plateau.
  - name: g6_negative_perturbation
    metric: min_perturbation_sharpe
    operator: "<"
    threshold: 0.0
    action: archive
    rationale: Geen enkele redelijke parameterverstoring mag de Sharpe negatief maken.
  - name: g7_interval_includes_zero
    metric: sharpe_ci_low_w_dev
    operator: "<="
    threshold: 0.0
    action: archive
    rationale: De circulaire-blokbootstrap-ondergrens (95 %) moet boven nul liggen.
  - name: g8_dsr_below_threshold
    metric: dsr_w_dev
    operator: "<"
    threshold: 0.95
    action: archive
    rationale: Onder DSR 0,95 bij de cumulatieve ledger-M (17) is de Sharpe niet te onderscheiden van selectieruis.
  - name: g9_overfit_probability
    metric: pbo
    operator: ">="
    threshold: 0.5
    action: archive
    rationale: Een PBO van 0,5 of meer betekent dat de beste in-sample variant out-of-sample meestal onder de mediaan valt.
  - name: gate_sharpe_collapse
    metric: gate_sharpe_z_vs_dev
    operator: "<"
    threshold: -1.645
    action: falsify
    rationale: >-
      Eén lezing van de holdout: valt de Sharpe daar eenzijdig significant (5 %)
      onder de W_DEV-schatting, dan is de backtest-Sharpe niet te reproduceren.
  - name: gate_drawdown
    metric: max_drawdown_gate
    operator: ">"
    threshold: 0.25
    action: falsify
    rationale: Ook in de holdout geldt de mandaatgrens.
  - name: promotion_requires_all_clear
    metric: n_binding_stop_criteria
    operator: "<="
    threshold: 0
    action: promote
    rationale: Papertrading vereist dat geen enkel criterium hierboven bindt.
