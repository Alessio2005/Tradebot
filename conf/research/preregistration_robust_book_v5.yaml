# conf/research/preregistration_robust_book_v5.yaml
# PRE-REGISTRATIE -- robuust boek v5: spot-perp-basiscarry (long spot, short perp), alleen
# en naast de trend-sleeve van v3. POST-HOC na v4 en zo geboekt (M = 21).
# Bevroren door `python -I -m tradebot.systematic.programme_v5 freeze`, vóór de eerste
# v5-run. Ontwerp: docs/superpowers/specs/2026-10-07-robust-book-v5-basis-design.md.
wave: robust_book_v5_basis

title: >-
  Funding oogsten zonder prijsweddenschap: long spot, short perp op de point-in-time top-50
  van Binance USDT-M (H1), dezelfde oogst naast trend long-flat met een vaste 50/50
  kapitaalverdeling (H2), en alleen op BTC en ETH (H3). Netto van fees, spread en impact op
  beide benen, met marge, liquidatie en delisting gemodelleerd.

hypothesis: >-
  Ten minste een van H1, H2 of H3 haalt op W_DEV een netto Sharpe van ten minste 1,0 en een
  netto CAGR van ten minste 15 % zonder portfolio margin (70 % spot, 30 % marge), consistent
  over TRAIN en VALIDATE, robuust voor kosten, vertraging en parameterverstoring, met DSR
  0,95 bij M = 21 en PBO onder 0,5; en de geselecteerde kandidaat stort niet in op de
  ongemeten backcast van 2020 en niet op de (besmette) holdout.

null_hypothesis: >-
  De funding die een short op Binance-perps ontvangt, dekt na de kosten van twee benen, het
  basisrisico en de periodes zonder carry niet de vereiste netto Sharpe en CAGR, of alleen
  in de bullmarkt van 2021. Een positief resultaat op een andere kandidaat dan de hoogst
  scorende weerlegt de nulhypothese niet.

universe: [BINANCE_USDT_M_TOP50_PIT_WITH_SPOT]
granularity: 1d
period_start: "2020-01-01"
period_end: "2026-09-30"
evaluation_start: "2021-01-01"
primary_metric: net_sharpe_w_dev

planned_trials: 3

data_series:
  - binance_um/klines/1d
  - binance_um/fundingRate
  - binance_spot/klines/1d

stop_criteria:
  - name: g1_sharpe_below_target
    metric: net_sharpe_w_dev
    operator: "<"
    threshold: 1.0
    action: archive
    rationale: De opdracht vraagt een netto Sharpe van ten minste 1,0.
  - name: g2_cagr_below_target
    metric: net_cagr_w_dev
    operator: "<"
    threshold: 0.15
    action: archive
    rationale: >-
      De opdracht vraagt een netto CAGR van ten minste 15 %, in het vaste kapitaalmodel
      (70 % spot, 30 % USDT-marge, geen portfolio margin; de trendhelft van H2 op het vaste
      vol-doel van 20 %). Meer notional om de CAGR te halen is uitgesloten.
  - name: g3_train_inconsistent
    metric: net_sharpe_train
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Een edge die alleen in één helft van W_DEV bestaat, is een regime, geen edge.
  - name: g3_validate_inconsistent
    metric: net_sharpe_validate
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Idem, voor de tweede helft.
  - name: g4_drawdown
    metric: max_drawdown_w_dev
    operator: ">"
    threshold: 0.25
    action: archive
    rationale: Mandaatgrens conf/risk/default.yaml::max_drawdown_pct.
  - name: g5_cost_fragile
    metric: sharpe_ratio_2x_cost_over_base
    operator: "<"
    threshold: 0.75
    action: archive
    rationale: Bij dubbele kosten moet minstens 75 % van de Sharpe overblijven.
  - name: g5_delay_fragile
    metric: sharpe_ratio_lag2_over_base
    operator: "<"
    threshold: 0.5
    action: archive
    rationale: Eén dag vertraging mag de Sharpe niet meer dan halveren.
  - name: g6_no_plateau
    metric: plateau_fraction
    operator: "<"
    threshold: 0.8
    action: archive
    rationale: >-
      Minstens 80 % van de parameterverstoringen moet meer dan de helft van de
      basis-Sharpe houden; anders staat de kandidaat op een piek, niet op een plateau.
  - name: g6_negative_perturbation
    metric: min_perturbation_sharpe
    operator: "<"
    threshold: 0.0
    action: archive
    rationale: Geen enkele redelijke parameterverstoring mag de Sharpe negatief maken.
  - name: g7_interval_includes_zero
    metric: sharpe_ci_low_w_dev
    operator: "<="
    threshold: 0.0
    action: archive
    rationale: De circulaire-blokbootstrap-ondergrens (95 %) moet boven nul liggen.
  - name: g8_dsr_below_threshold
    metric: dsr_w_dev
    operator: "<"
    threshold: 0.95
    action: archive
    rationale: Onder DSR 0,95 bij de cumulatieve ledger-M (21) is de Sharpe niet te onderscheiden van selectieruis.
  - name: g9_overfit_probability
    metric: pbo
    operator: ">="
    threshold: 0.5
    action: archive
    rationale: Een PBO van 0,5 of meer betekent dat de beste in-sample variant out-of-sample meestal onder de mediaan valt.
  - name: backcast_sharpe_collapse
    metric: backcast_sharpe_z_vs_dev
    operator: "<"
    threshold: -1.645
    action: falsify
    rationale: >-
      De backcast (2020-04 .. 2020-12) is nooit gemeten. Valt de Sharpe daar eenzijdig
      significant (5 %) onder de W_DEV-schatting, dan is de W_DEV-Sharpe niet te reproduceren.
  - name: backcast_drawdown
    metric: backcast_max_drawdown
    operator: ">"
    threshold: 0.25
    action: falsify
    rationale: Ook in de backcast geldt de mandaatgrens.
  - name: backcast_no_positive_sharpe
    metric: backcast_net_sharpe
    operator: "<="
    threshold: 0.0
    action: archive
    rationale: Een niet-positieve netto Sharpe op het ongemeten sample bevestigt niets.
  - name: holdout_sharpe_collapse
    metric: holdout_sharpe_z_vs_dev
    operator: "<"
    threshold: -1.645
    action: falsify
    rationale: >-
      De holdout is besmet (het fundingniveau daar is in v4 gezien) en kan daarom alleen
      verwerpen: een significante ineenstorting falsificeert, een goed resultaat telt niet.
  - name: holdout_drawdown
    metric: holdout_max_drawdown
    operator: ">"
    threshold: 0.25
    action: falsify
    rationale: Ook in de holdout geldt de mandaatgrens.
  - name: promotion_requires_all_clear
    metric: n_binding_stop_criteria
    operator: "<="
    threshold: 0
    action: promote
    rationale: Papertrading vereist dat geen enkel criterium hierboven bindt.
