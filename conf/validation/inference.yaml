# conf/validation/inference.yaml — L11 inferentiekern (fase 10, stap 4A)
# Gevalideerd tegen schemas/config.py::InferenceConfig (extra="forbid", frozen).
#
# WAAROM DIT BESTAAT
# ------------------
# `validation/inference.py` is de ENIGE implementatie van de Sharpe-standaardfout
# (Lo 2002 met Newey-West), van de Sharpe-verschiltoets (Ledoit-Wolf 2008) en van
# de circulaire blokbootstrap. `src/tradebot/validation/` heeft in
# `scripts/check_hardcoded_params.py` ratchet-budget 0: geen enkele drempel mag
# daar in een handtekening staan. Elke keuze die het gedrag van de toets bepaalt,
# staat daarom hier — gehasht en auditbaar.
#
# WAT HIER WEL EN NIET IN HOORT
# -----------------------------
# WEL: het aantal bootstrap-replicaties, de seed, het betrouwbaarheidsniveau, de
# ondergrens op de steekproef, de bloklengte. Dat zijn alle vijf keuzes die de
# uitkomst van een toets verschuiven en die achteraf kunnen worden bijgesteld om
# een resultaat door een poort te krijgen.
#
# NIET: `bars_per_year`. Die staat in `conf/backtest/default.yaml` en nergens
# anders (MEASUREMENT_CONTRACT.md §1). Hem hier herhalen zou een tweede
# annualisatie in omloop brengen, en de repository had er al drie.
#
# NIET: de Newey-West bandbreedte `4 (T/100)^(2/9)`. Dat is de formule van
# Newey & West (1987) zoals MEASUREMENT_CONTRACT.md §3 hem voorschrijft, geen
# beleidskeuze. Hij wordt per steekproef uit haar eigen `T` berekend.
inference:

  # --- Blokbootstrap ------------------------------------------------------ #
  # MEASUREMENT_CONTRACT.md §4 schrijft n_boot = 10.000 voor. Dit is geen
  # nauwkeurigheidsknop die per meting mag worden bijgesteld: een p-waarde die
  # bij 2.000 replicaties net onder 0,05 uitkomt en bij 10.000 net erboven, is
  # geen bevinding maar een steekproeffout in de toets zelf.
  n_boot: 10000

  # De GEREGISTREERDE seed (R-5: gelijke cfg + seed => bit-identieke output).
  # Vastgelegd op de datum van stap 4A. Een seed die per run wordt gekozen, maakt
  # elke bootstrap-CI onreproduceerbaar; een seed die per meting wordt gekozen,
  # maakt haar selecteerbaar.
  seed: 20260905

  # De bloklengte van de CIRCULAIRE blokbootstrap (Politis-Romano 1992).
  # `null` = automatisch gekalibreerd uit het autocorrelatieverval van de reeks
  # zelf, zoals §4 voorschrijft. Een getal overschrijft die kalibratie en is
  # bedoeld voor een reproductie van een eerdere meting, niet voor productie.
  block_length: null

  # De bootstrap wordt in batches van deze omvang getrokken zodat het geheugen
  # niet lineair in `n_boot` groeit. De batchgrootte is VAST en staat in `conf/`
  # omdat zij de trekvolgorde uit de generator bepaalt: een andere batchgrootte
  # geeft dezelfde verdeling maar niet dezelfde bits, en R-5 eist de bits.
  bootstrap_batch_size: 250

  # --- Intervallen -------------------------------------------------------- #
  # Het betrouwbaarheidsniveau van elk gerapporteerd interval. Eén niveau voor
  # de hele fase, zodat een interval niet stilzwijgend ruimer kan staan dan zijn
  # buur.
  ci_level: 0.95

  # --- Ondergrens op de steekproef ---------------------------------------- #
  # Onder dit aantal observaties steunt noch de Lo-benadering, noch de
  # Ledoit-Wolf-asymptotiek op iets. De toets WEIGERT dan in plaats van een
  # standaardfout te leveren die nergens op slaat. Zelfde grens en zelfde reden
  # als `validation/sharpe_difference.py::_MIN_OBS` en `dsr.py::MIN_OBS_FOR_DSR`.
  min_obs: 30
