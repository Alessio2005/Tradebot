# conf/execution/fees.yaml — L9 kosten
# Gevalideerd tegen schemas/config.py::ExecutionConfig.
#
# LET OP: de spread-aanname hieronder is VOORLOPIG. De definitieve eta-kalibratie
# op orderboekdata volgt in Phase 5. Tot die tijd rapporteert elk backtest-
# resultaat bruto EN netto, met deze aanname expliciet vermeld
# (Phase 3, stap 9).
execution:
  # Bybit VIP-0 linear perpetuals.
  maker_fee_bps: 2.0
  taker_fee_bps: 5.5

  # Conservatieve half-spread aanname.
  assumed_half_spread_bps: 1.0

  slippage_model: half_spread

  # `impact_eta` stond hier op 0.142 en is in Phase 5 VERPLAATST naar
  # `conf/execution/impact.yaml`. Reden: het was een literatuurwaarde
  # (Bouchaud-Bonart op BTC-perps) met een schema-default, dus een eta die
  # stilzwijgend bestond zonder ooit gemeten te zijn - en bovendien werd hij
  # door geen enkele module gelezen. Fase-opdracht 11 eist dat een ontbrekende
  # eta een ConfigContractError is; `ImpactConfig` heeft daarom geen defaults.

  cost_assumption_is_provisional: true
