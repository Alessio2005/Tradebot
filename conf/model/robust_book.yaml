# conf/model/robust_book.yaml — het robuuste boek v1.
# Gevalideerd tegen tradebot/schemas/robust_book.py::RobustBookConfig (plat document).
# Ontwerp en verantwoording: docs/superpowers/specs/2026-10-07-robust-book-design.md.
# Deze waarden worden bij het bevriezen in de preregistratie ingespoten; een
# wijziging na het bevriezen is een amendement en kost een trial.
symbols: [BTCUSDT, ETHUSDT, SOLUSDT, AVAXUSDT, LINKUSDT, DOTUSDT]

windows:
  w_dev_start: "2021-11-15"
  train_end: "2023-12-31"
  validate_start: "2024-01-01"
  w_dev_end: "2025-09-04"
  # = artefacts/governance/holdout_lock.json::split_utc
  gate_start: "2025-09-05"

execution:
  # Besluit op close t, nieuw gewicht rendeert vanaf t+1.
  lag_bars: 1
  # = conf/backtest/default.yaml::initial_equity
  aum_usd: 100000.0

sizing:
  vol_span: 60
  min_history_bars: 60
  asset_vol_target: 0.20
  portfolio_vol_target: 0.20
  max_scale: 2.0
  per_asset_cap: 1.0
  gross_cap: 3.0

trend:
  # Log-raster 5..160 met stap ~sqrt(2): de vereniging van de twee rasters die
  # het vorige programma als even plausibel aanmerkte. Geen selectie.
  lookbacks: [5, 7, 10, 14, 20, 28, 40, 56, 80, 112, 160]
  z_clip: 1.0

core:
  assets: [BTCUSDT, ETHUSDT]

carry:
  window_bars: 7
  signal_lag_bars: 1
  rebalance_bars: 7

combo:
  inclusion_min_train_sharpe: 0.0

# B1, B2, C1..C5.
planned_trials: 7
# Bekende trials op dezelfde zes munten sinds de ledger-reset, op ongemergde
# branches: weekly-meta 4, trend/carry 47, BTC-MA100 1. Alleen voor de
# gerapporteerde tweede DSR, niet voor de poort.
known_prior_trials: 52
