# conf/model/volatility.yaml — L2 volatiliteit
# Gevalideerd tegen schemas/config.py::VolatilityConfig.
#
# BINDEND (audit sectie 9.1 / 22): Level 1 = EWMA/RiskMetrics met lambda = 0.94
# is de BASELINE. GARCH is Level 2 en is in Phase 3 expliciet VERBODEN; die
# competitie hoort in Phase 6.
volatility:
  estimator: ewma

  # RiskMetrics-conventie.
  ewma_lambda: 0.94

  # Aantal observaties voordat de schatting bruikbaar is. Daarvoor propageert de
  # estimator NaN — nooit een impliciete constante volatiliteit (Phase 3, stap 3).
  burn_in_bars: 60

  # Daily bars, crypto handelt 365 dagen per jaar.
  annualisation_factor: 365.0
  min_periods: 2

  # --- Meerstaps GARCH-forecasts (Phase 6, stap 7) ------------------------- #
  # EGARCH en APARCH hebben GEEN analytische meerstaps-forecast: de recursie
  # loopt in ln(sigma^2) resp. sigma^delta en de terugtransformatie heeft geen
  # gesloten vorm. `arch` weigert die berekening, en terecht.
  #
  # De h > 1-forecast wordt daarom GESIMULEERD, en dan voor alle vier de
  # varianten, zodat geen model op dezelfde horizon een andersoortige forecast
  # krijgt dan zijn concurrent. Op GARCH(1,1) — waar beide bestaan — komt de
  # gesimuleerde forecast op vier significante cijfers overeen met de
  # analytische; dat is getoetst in tests/unit/test_garch_family.py.
  forecast_simulations: 5000

  # Vaste seed: zonder deze is een QLIKE-uitslag op h = 5 niet herhaalbaar.
  forecast_seed: 20260826
