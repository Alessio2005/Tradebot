# conf/model/adequacy.yaml — L11 Data Adequacy Gate (Phase 6, §3)
# Gevalideerd tegen schemas/config.py::AdequacyConfig (extra="forbid", frozen).
#
# WAAROM DIT BESTAAT
# ------------------
# Het universum is 6 gecertificeerde reeksen × 1.743 daily bars. Op die omvang
# zijn er twee manieren om een verkeerd antwoord te geven die er allebei
# statistisch correct uitzien:
#
#   * een model FALSIFICEREN dat simpelweg te weinig data had;
#   * een model PROMOVEREN dat op tientallen observaties per toestand is gefit.
#
# Elke drempel hieronder is een minimumeis die VOOR de fit wordt gemeten. Haalt
# een modelklasse haar niet, dan wordt zij niet gefit, krijgt zij het oordeel
# `UNPROVEN — insufficient data` met de gemeten cijfers erbij, en telt de trial
# NIET mee in M omdat er geen search heeft plaatsgevonden.
#
# De drempels zijn conventies uit de literatuur, geen resultaten van deze data.
# Zij zijn hier vastgelegd VOORDAT er is gemeten, zodat een drempel niet achteraf
# kan worden verlaagd om een model door de poort te krijgen.
adequacy:

  # --- Level 2: GARCH-familie -------------------------------------------- #
  # Bollerslev/Engle-praktijk: een GARCH(1,1) met Student-t innovaties schat
  # 5 parameters (omega, alpha, beta, mu, nu); GJR en APARCH schatten er 6-7.
  # De gangbare vuistregel voor een stabiele QML-fit op financiële dagdata is
  # enkele honderden observaties; onder ~250 worden alpha en beta slecht
  # geïdentificeerd en loopt beta naar de rand (IGARCH-degeneratie).
  garch:
    # 250 en niet 500. DEFECT IN MIJN EIGEN WERK, gevonden vóór de eerste fit
    # en hier vastgelegd: de eerste versie van deze drempel stond op 500 en was
    # OVERGESCHREVEN van `train_bars: 500` uit conf/validation/default.yaml in
    # plaats van AFGELEID uit de identificatie-eis. Zij faalde daardoor met
    # precies 5 observaties — de embargolengte — op elk symbool, en dat is geen
    # databevinding maar een specificatiefout in de poort zelf.
    #
    # De afgeleide waarde: QML-identificatie van een GARCH(1,1) met Student-t
    # innovaties (5 parameters) vereist volgens de simulatieliteratuur enkele
    # honderden observaties voordat de bias in alpha en beta acceptabel is;
    # 250 is de gangbare ondergrens. GJR en APARCH schatten er 6-7 en zitten
    # daar dichter tegenaan.
    #
    # Het effectieve fit-venster op deze reeks is 495 bars (500 min de embargo
    # van 5). De data haalt de afgeleide eis dus met een factor ~2, en de
    # drempel is niet gekozen om nét te passeren.
    min_obs_per_fit_window: 250
    # Aandeel fits dat moet convergeren voordat de resultaten van een model
    # überhaupt vergelijkbaar zijn. Onder deze ratio is de QLIKE-reeks een
    # selectie van de gemakkelijke vensters.
    min_convergence_ratio: 0.90
    # |alpha + beta| hierboven telt als randoplossing (IGARCH): de
    # onvoorwaardelijke variantie bestaat dan niet en de forecast is een
    # random walk in variantie.
    persistence_boundary: 0.999
    max_boundary_solution_ratio: 0.10

    # Een variantieforecast boven dit veelvoud van de gemiddelde gekwadrateerde
    # return is geen forecast meer maar een numeriek artefact. GEMETEN op
    # 2026-08-29: de gesimuleerde 5-staps EGARCH-forecast liep op BTCUSDT op tot
    # 4,5e25 maal die referentie en op ETHUSDT tot 3,6e17. De EGARCH-recursie
    # loopt in ln(sigma^2); de verwachting van exp van een zwaarstaartige random
    # walk hoeft niet te bestaan, en dan schat de simulatie een moment dat er
    # niet is.
    #
    # QLIKE verbergt dat bijna — hij groeit logaritmisch in een overschatting,
    # dus een handvol geëxplodeerde bars verschuift het gemiddelde nauwelijks.
    # Precies daarom staat hier een grens: het getal ziet er anders bruikbaar uit.
    #
    # 100 is tienmaal in volatiliteit en dus ruim. De gemeten uitschieters liggen
    # er vijftien ordes boven; de conclusie hangt niet aan dit getal.
    max_forecast_level_ratio: 100.0

  # --- Level 3: HAR-RV --------------------------------------------------- #
  # Corsi (2009) schat HAR op realized variance uit intraday returns. De
  # standaard is 5-minuutsampling: 288 bars per dag voor een 24-uursmarkt.
  # Onder een bepaalde dagdekking is de RV-schatting van die dag zo ruizig dat
  # zij het QLIKE-verschil domineert dat je probeert te meten.
  har_rv:
    intraday_granularity: 5m
    min_bars_per_day: 200          # van de 288 mogelijke 5m-bars (69 %)
    min_days_with_coverage_pct: 80.0
    min_obs_per_fit_window: 500

  # --- Level 3 regimes: M2 HMM ------------------------------------------- #
  # Een k-state Gaussian HMM schat per toestand een mean, een variantie en
  # k-1 transitiekansen. De verwachte bezetting van de ZELDZAAMSTE toestand
  # per fold is de bindende grootheid: een toestand die in een fold 30 bars
  # beslaat, levert een variantieschatting met ~26 % relatieve standaardfout.
  hmm:
    min_obs_per_state_per_fold: 100
    # Onder deze verwachte bezetting is de toestand een uitschieterdetector
    # in plaats van een regime.
    min_state_occupancy_fraction: 0.10

  # --- Fase 10: de GEREALISEERDE bezetting van een VolState-toewijzing --- #
  # DIT BLOK BESTAAT OMDAT HET `hmm:`-BLOK HIERBOVEN ZIJN WERK NIET DEED.
  # Dat blok toetst VOOR de fit en kent de bezetting dan nog niet; zonder pilot
  # rekent het met een uniforme 1/k en noemt dat in het artefact zelf
  # "uniform (1/k) — optimistisch". Voor hmm_k3 gaf die aanname 165,0
  # observaties per fold en `adequate: true`, terwijl de fit er 5,0 tot 28,0
  # opleverde tegen diezelfde eis van 100. De poort keurde dus goed op een
  # aanname die zij zelf optimistisch noemt. Dat is een defect in de poort en
  # niet in het model, en het is pas NA de fit gezien.
  #
  # EN BARS ALLEEN VOLSTAAN OOK NIET.
  # Een toestand is persistent. 499 HOOG-bars in twaalf episodes zijn twaalf
  # observaties en geen 499: bars binnen één episode dragen vrijwel dezelfde
  # informatie. Een poort die alleen bars telt, keurt een toestand goed die uit
  # een handvol clusters bestaat en die statistisch niets draagt. Er staan
  # daarom TWEE eisen; het oordeel gaat over de strengste en over het MINIMUM
  # over de folds (AD-18), nooit over de mediaan.
  #
  # Deze drempels zijn conventies en staan vast VOORDAT er is gemeten. Zij
  # verlagen tot de poort groen wordt, is hetzelfde defect in nieuwe kleren.
  vol_state:
    # Gelijk aan `hmm.min_obs_per_state_per_fold` hierboven: het is dezelfde
    # grootheid, alleen gemeten in plaats van aangenomen. Twee getallen onder
    # één eis zouden de vergelijking a priori/gerealiseerd betekenisloos maken.
    min_obs_per_state_per_fold: 100
    # 20 en niet 100. De EPISODE is de eenheid waarin een persistente toestand
    # informatie levert, en er zijn er per definitie veel minder dan bars: een
    # toestand met een gemiddelde duur van vijf bars levert bij 100 bars twintig
    # episodes. Onder de twintig wordt elk gemiddelde over die toestand door een
    # handvol blokken bepaald, en dan meet je die blokken en niet het regime.
    min_episodes_per_state_per_fold: 20
    # Zelfde naam en zelfde waarde als `hmm.min_state_occupancy_fraction`:
    # onder deze bezetting is de toestand een uitschieterdetector en geen regime.
    min_state_occupancy_fraction: 0.10

  # --- Meta-labeling: CatBoost ------------------------------------------- #
  # López de Prado's vuistregel voor een secondary model is enkele honderden
  # events per fold NA purging en embargo. De klassebalans moet daarnaast
  # binnen een band liggen: bij 95 % één klasse is een AUC boven de drempel
  # verenigbaar met een model dat vrijwel niets leert.
  meta_labeling:
    # NOMINAAL aantal events per fold.
    min_events_per_fold: 200
    # EFFECTIEF aantal, na correctie voor labeloverlap (AFML hoofdstuk 4).
    # Met een event op vrijwel elke bar en een horizon van 10 bars overlapt elk
    # label met ~10 buren; het nominale aantal overschat de informatie-inhoud
    # dan met ongeveer die factor. Deze tweede eis is wat de gate ECHT toetst;
    # zonder haar zou "2.900 events per fold" een geruststelling zijn die de
    # data niet draagt.
    min_effective_events_per_fold: 100
    min_positive_class_ratio: 0.20
    max_positive_class_ratio: 0.80

  # --- Portfolio: HRP ---------------------------------------------------- #
  # Een correlatiematrix op N assets uit T observaties is pas stabiel als
  # T >> N. Bij T/N < 10 is de sample-correlatiematrix slecht geconditioneerd
  # en is de HRP-boomordening een functie van de ruis.
  hrp:
    min_obs_per_asset: 10          # T / N
    max_condition_number: 100.0

  # --- Power-analyse ------------------------------------------------------ #
  # Gedeeld door alle drie de pre-registraties (§3, exit-criterium 10).
  power:
    alpha: 0.05
    target_power: 0.80
    two_sided: true

  # --- De variantieproxy van de QLIKE-competitie (stap 7) ------------------ #
  # QLIKE heeft zijn minimum op `forecast = E[proxy]`. Zit er een
  # multiplicatieve factor in de proxy ten opzichte van de grootheid die de
  # modellen voorspellen — de variantie van de close-to-close return — dan
  # verschuift dat minimum mee en wint het model waarvan het NIVEAU bij die
  # factor past. De rangorde meet dan kalibratie tegen een verschoven doel in
  # plaats van voorspelkwaliteit.
  #
  # De referentie is de gekwadrateerde return: die is ruisig, maar per
  # constructie zuiver voor precies de voorspelde grootheid.
  #
  # 0,15 is ruim. De H1-run van 2026-08-29 mat 1,19 tot 2,24 — geen enkele
  # redelijke tolerantie laat dat door, dus de conclusie hangt niet aan de
  # exacte waarde hier.
  proxy:
    max_scale_deviation: 0.15
