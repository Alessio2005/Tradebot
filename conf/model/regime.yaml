# conf/model/regime.yaml — L3 regime-engines (Phase 6, deliverables 14 en 15)
# Gevalideerd tegen schemas/config.py::RegimeConfig (extra="forbid", frozen).
#
# M0 CAUSAL VOL-BUCKETS IS DE BASELINE PRODUCTIE (audit §10.1).
#
# Hij heeft NUL latente toestanden en NUL geschatte parameters. Dat maakt hem
# tot een oneerlijk sterke tegenstander voor het M2 Filtered HMM, en precies
# daarom is hij de juiste baseline: elk verschil dat het HMM laat zien, moet
# groot genoeg zijn om de schattingsonzekerheid te overtreffen die M0 per
# constructie niet heeft.
#
# Elke waarde hieronder is een DREMPEL, geen schatting. Zij is vastgelegd
# VOORDAT er is gemeten en komt niet uit deze data; wie haar wijzigt om een
# gunstiger uitkomst te krijgen, voert een nieuwe trial uit en verhoogt M.
regime:
  m0:
    # De z-score loopt over de LOG van de causale EWMA-volatiliteit. Log en
    # niet niveau, omdat de volatiliteitsverdeling sterk rechtsscheef is: op
    # het niveau zou een enkele crashbar de standaardafwijking domineren en
    # zou de HOOG-drempel daarna jarenlang onbereikbaar zijn.
    #
    # +/- 0,5 sigma en niet +/- 1,0: op 1.743 bars laat +/- 1,0 ongeveer 32 %
    # van de bars buiten NORMAAL, +/- 0,5 ongeveer 62 %. De bredere band geeft
    # elk regime genoeg bars om een Sharpe op te meten — zie de
    # occupancy-eis in conf/model/adequacy.yaml. Deze keuze is een
    # ARCHITECTUURBESLUIT en staat als zodanig in docs/ARCHITECTURAL_DECISIONS.md.
    zscore_low:  -0.5
    zscore_high:  0.5

    # De causale z-score gebruikt uitsluitend het verleden: op bar t het
    # expanding gemiddelde en de expanding standaardafwijking over bars 0..t.
    # Vóór deze grens BESTAAT het regime niet en is de uitkomst NaN. Er wordt
    # niet teruggevallen op NORMAAL — "geen oordeel" is een geldige uitkomst en
    # "normaal" is een bewering.
    #
    # 250 bars ~ acht maanden dagdata: genoeg dat de expanding std niet meer
    # door een enkele bar wordt bepaald, en het laat 1.493 van de 1.743 bars
    # over voor de vergelijking.
    zscore_min_periods: 250

    # De ATR-ratio is de TWEEDE as: niet het NIVEAU van de volatiliteit maar de
    # RICHTING waarin zij beweegt. 5 bars tegen 20 bars is een week tegen een
    # maand.
    atr_fast_window: 5
    atr_slow_window: 20
    atr_ratio_low:  0.85
    atr_ratio_high: 1.15

  # M1 MARKOV CHAIN EN M2 HMM — DIT IS EEN ZOEKRUIMTE, GEEN DREMPEL
  # ==================================================================
  # Alles onder `m0` hierboven is een drempel: vooraf vastgelegd, nul geschatte
  # parameters, nul trials. Alles hieronder bepaalt HOEVEEL er wordt gezocht, en
  # dus hoeveel trials er in `M` horen.
  #
  #   M1 Markov Chain    k = 2 en k = 3   ->  2 trials
  #   M2 HMM gaussian    k = 2 en k = 3   ->  2 trials
  #   M2 HMM student_t   k = 2 en k = 3   ->  2 trials
  #                                       ==  6 trials
  #
  # Dat is exact het `planned_trials` van de bevroren pre-registratie
  # 3d3af28730a6c7f9da48d13139522a05, en die zes zijn bij het bevriezen al in de
  # ledger geboekt. Wie `n_states_grid` uitbreidt, voert een grotere search uit
  # dan is geboekt en maakt elke DSR daarna te gunstig; dat vraagt een NIEUWE
  # pre-registratie en niet het oprekken van deze.
  m2:
    n_states_grid: [2, 3]

    # Univariate emissies (één log-return per symbool), dus `diag` en `full`
    # vallen samen. `diag` staat er omdat hij dan ook op een multivariate
    # uitbreiding het goedkoopste contract is.
    covariance_type: diag

    # Niet-convergentie is een RESULTAAT dat wordt geregistreerd, geen probleem
    # dat wordt weggevangen. Deze grens bepaalt wanneer dat resultaat valt.
    n_iter: 200
    em_tolerance: 1.0e-6

    # STUDENT-T VRIJHEIDSGRADEN. `dof_init` is het startpunt van de EM, niet de
    # uitkomst: nu wordt per toestand geschat, net zoals `arch` dat voor de
    # GARCH-familie doet. De grenzen zijn er omdat beide uiteinden betekenisloos
    # zijn: onder 2 bestaat de variantie van een t-verdeling niet, en boven 200
    # is zij numeriek niet meer van een normale te onderscheiden. Raakt de fit
    # een grens, dan staat dat in het fitrapport en wordt het niet weggerond.
    dof_init: 8.0
    dof_min:  2.1
    dof_max:  200.0

    # De Gaussische EM (hmmlearn) initialiseert met k-means en heeft dus een
    # seed nodig. De Student-t EM start van de UITKOMST van die Gaussische fit,
    # zodat het verschil tussen beide varianten de emissieverdeling is en niet
    # het startpunt. Eén seed volstaat daarom voor allebei.
    seed: 20260830

    # DE SINGULARITEIT VAN EEN t-MENGSEL, EN WAAROM ZIJ EEN GRENS NODIG HEEFT.
    # Krijgt een toestand nog maar een handvol punten die dicht op zijn
    # gemiddelde liggen, dan gaat zijn schaal naar nul en de likelihood naar
    # oneindig (Hathaway 1985). Dat is geen optimum maar een singulariteit, en
    # zij treedt op zodra `k` groter is dan het aantal regimes dat de data
    # draagt. De EM stopt daar, rolt terug naar de laatste geldige iteratie en
    # meldt `degenerate` -- hetzelfde contract als `fit_garch_window`.
    #
    # 1e-4 op de VERHOUDING van de schalen, niet op een schaal zelf. Op deze
    # data lopen de dagelijkse volatiliteiten van ongeveer 0,5 % tot 10 %, dus
    # een echte verhouding tussen twee regimes is hooguit (0,10/0,005)^2 = 400,
    # oftewel 2,5e-3. De grens ligt daar een orde onder en kan dus geen ECHT
    # regimeverschil afkappen; zij vangt alleen de instorting.
    min_scale_ratio: 1.0e-4
