# conf/model/robust_book_v6.yaml — robuust boek v6: de basiscarry van v5 met hefboom,
# in één unified (portfolio-)margin-account.
# Alle blokken van v5 zijn ONGEWIJZIGD; de slotregel (`basis:`) is die van v5-H1. Niet
# gebruikt door v6: `basis.notional`, `basis.margin_floor`, `basis.maintenance_margin`
# (het tweewalletmodel van v5) en `basis.combo_trend_share` (geen trendcombinatie).
# Nieuw: `leverage:` en `forward:`.
# Gevalideerd tegen tradebot/schemas/robust_book_v2.py::RobustBookV6Config.
# Ontwerp: docs/superpowers/specs/2026-10-09-robust-book-v6-levered-carry-design.md.
# Elke waarde in `leverage:` is VOORAF gekozen, met de reden ernaast; geen ervan is op
# data getuned. Een wijziging na het bevriezen is een amendement en kost een trial.
universe:
  top_n: 50
  min_history_bars: 90
  adv_window: 30
  min_adv_usd: 5000000.0
  vol_window: 60
  min_ann_vol: 0.15

windows:
  train_start: "2021-01-01"
  train_end: "2023-12-31"
  validate_start: "2024-01-01"
  w_dev_end: "2025-06-30"
  holdout_start: "2025-07-01"
  holdout_end: "2026-09-30"

execution:
  lag_bars: 1
  aum_usd: 1000000.0

costs:
  # = conf/execution/fees.yaml::taker_fee_bps (Binance VIP0 = 5,0; dit is conservatief).
  taker_fee_bps: 5.5
  min_half_spread_bps: 1.0
  max_half_spread_bps: 25.0
  spread_window: 60
  # Literatuur-Y voor de vierkantswortelwet; de repo-bovengrens is de stress.
  impact_y: 1.0
  impact_y_stress: 2.991922

sizing:
  vol_span: 60
  asset_vol_target: 0.20
  portfolio_vol_target: 0.20
  max_scale: 3.0
  per_asset_cap: 0.20
  gross_cap: 4.0

xsmom:
  lookbacks: [7, 14, 28, 56]
  winsor: 3.0
  rebalance_bars: 7

xscarry:
  window_bars: 7
  signal_lag_bars: 1
  rebalance_bars: 7

trend:
  lookbacks: [5, 7, 10, 14, 20, 28, 40, 56, 80, 112, 160]
  z_clip: 1.0

combo:
  candidates: [X1_XSMOM, X2_XSCARRY, X4_TREND_LF]
  inclusion_min_train_sharpe: 0.0

# K1/K2/K3: het basisboek van v5-H1 bij 1x, 1,5x en 2x notional per been.
planned_trials: 3
known_prior_trials: 52

v3:
  half_spread_bps: 3.0
  half_spread_stress_bps: 6.0
  trade_rate: 0.2
  trade_rate_family: [0.1, 0.33, 1.0]

basis:
  # EWMA van de dagfunding: een maand. Funding is persistent (dagen tot weken), een
  # kortere span jaagt ruis na, een langere reageert te laat op een omslag.
  funding_span: 30
  # Instap bij >= 15 %/jaar verwachte carry. Een rondgang kost beide benen
  # ~2 x (10 + 5 + 5,5 + 3) bp = ~47 bp plus impact; bij ~6 weken houden is dat ~4 %/jaar.
  # 15 % laat ruim marge voor het verval van de schatting.
  enter_apr: 0.15
  # Uitstap onder 5 %/jaar: daaronder dekt de carry de kosten van het vasthouden en het
  # basisrisico niet meer. Het gat 5-15 % is de hysterese tegen churn.
  exit_apr: 0.05
  # Tien slots van elk 7 % van de equity: genoeg spreiding tegen één squeeze of delisting.
  slots: 10
  # Kapitaalmodel zonder portfolio margin: 70 % spot, 30 % USDT-marge in de futureswallet
  # (perp-hefboom ~2,3x op de notional). Geen hefboom om rendement te maken.
  notional: 0.70
  # Een munt wordt pas teruggezet als zijn notional > 50 % van het doel afwijkt:
  # gelijke hoeveelheden blijven gehedged zonder te handelen.
  band: 0.5
  # Benen die meer dan 2 % uiteenlopen (basisbeweging) worden opnieuw gelijkgezet.
  hedge_tolerance: 0.02
  # Spotliquiditeit: >= 2 mln USDT per dag (30d gemiddeld), anders is het spotbeen te dun.
  min_spot_adv_usd: 2000000.0
  # |perp/spot - 1| > 5 % op een dag is een datafout of een ander activum (BTCSTUSDT): niet instappen.
  max_abs_basis: 0.05
  # Binance spot VIP0 = 10 bp (7,5 met BNB); 10 is conservatief.
  spot_taker_fee_bps: 10.0
  # Spot-altcoins quoteren breder dan hun perp: 5 bp, met 10 bp als stress.
  spot_half_spread_bps: 5.0
  spot_half_spread_stress_bps: 10.0
  # Onderhoudsmarge voor de liquidatietoets: 2 % van de perp-notional (Binance: 0,4-2,5 %
  # voor de kleinere tiers; 2 % is de bovenkant voor de meeste top-50-munten).
  maintenance_margin: 0.02
  # Margevloer: zakt de futureswallet onder 25 % van de perp-notional (> 4x), dan gaat het
  # hele boek terug naar het doel. Bij de volle notional is de wallet 30/70 = 43 %.
  margin_floor: 0.25
  majors: [BTCUSDT, ETHUSDT]
  # H2: half het kapitaal in het basisboek, half in de trend-sleeve (Y4, ongewijzigd).
  combo_trend_share: 0.5

# Het ongemeten sample: 2020, vóór W_DEV. Het universum heeft 90 bars historie nodig
# (de panelen beginnen op 2020-01-02), dus de backcast begint in april.
backcast:
  start: "2020-04-01"
  end: "2020-12-31"

# --------------------------------------------------------------------------- #
# v6: het hefboomboek. Eigenaarsbesluit 2026-10-09: hoog risico toegestaan. Het
# mandaat van conf/risk/default.yaml blijft staan: bruto <= 4,0 (beide benen),
# ADV-participatie <= 1 %, max drawdown 25 %.
# --------------------------------------------------------------------------- #
leverage:
  # Notional per been als veelvoud van de equity. 2,0 is de bovengrens: twee benen
  # van 2,0 is bruto 4,0, precies risk.gross_cap. Hoger zou het mandaat oprekken.
  candidates:
    K1_CARRY_PM_1X: 1.0
    K2_CARRY_PM_1P5X: 1.5
    K3_CARRY_PM_2X: 2.0
  majors: [BTCUSDT, ETHUSDT]
  # Onderpandhaircut op spot. Binance PM: BTC/ETH collateral ratio 0,95; de meeste
  # top-50-alts 0,7-0,9 en lager per tier. 20 % is de conservatieve kant voor de alts,
  # 35 % de stress.
  haircut_major: 0.05
  haircut_alt: 0.20
  haircut_alt_stress: 0.35
  # Onderhoudsmarge op de perp-notional: 2 % zoals v5 (de bovenkant van de kleine
  # tiers; BTC zit op 0,4 %). Stress 3 %.
  maintenance_margin: 0.02
  maintenance_margin_stress: 0.03
  # Onderhoud op geleende USDT: 5 % van de lening (conservatief; een margelening is
  # zelf onderpand-gedekt).
  loan_maintenance: 0.05
  # Governor: haircut-equity minstens 3x de onderhoudsmarge na elke trade. Binance
  # liquideert een PM-account rond 1,05 en waarschuwt op 1,5; 3 is de gangbare
  # werkgrens voor een basisboek.
  min_uni_mmr: 3.0
  # = conf/risk/default.yaml::gross_cap (beide benen).
  gross_cap: 4.0
  # Wat een liquidatie kost bovenop de verliezen in de stressstaat: 1,5 % van de bruto
  # notional (liquidation clearance fee plus slippage bij een gedwongen sluiting).
  liquidation_fee: 0.015
  # = conf/risk/default.yaml::adv_participation_cap. Een marktfeit, geen bereidheid:
  # boven ~1 % van de ADV is de impact het hele resultaat. Geldt per been op het
  # dunste been (spot of perp). v5 dwong hem niet af.
  adv_participation_cap: 0.01
  # Financiering van geleende USDT: max(8 %, BTC-carry). Een USDT-uitlener kan zelf de
  # BTC-basis oogsten, dus lenen onder dat tarief is geen gratis geld. De 8 % vloer
  # ligt boven de gangbare Binance-tarieven in kalme markten (~4-6 %).
  financing_floor_apr: 0.08
  financing_multiplier: 1.0
  # Stress: 12 % vloer en 1,5x de BTC-carry. Optimistisch (alleen ter informatie,
  # geen poort): een constante 6 %.
  financing_stress_floor_apr: 0.12
  financing_stress_multiplier: 1.5
  financing_optimistic_apr: 0.06

# Het vooruit-sample: begint na de laatste data die bij het bevriezen bestond
# (2026-09-30). Gelezen pas als er minstens zes volle maanden zijn.
forward:
  start: "2026-10-01"
  min_months: 6
