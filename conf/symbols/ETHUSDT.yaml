# conf/symbols/ETHUSDT.yaml
asset_class: crypto
binance_symbol: ETHUSDT

# ETH is iets volatieler dan BTC → iets ruimere CUSUM zodat we niet door ruis
# overspoeld worden.
cusum_threshold_multiplier: 1.7

# Iets kortere label-horizon: ETH-momentum decayed sneller dan BTC.
label_horizon: 22
label_t_min: 5
label_t_max: 22
label_min_tstat: 2.0
label_pt_width: 2.0
label_sl_width: 1.0
label_candidate_horizons: [12, 18, 25]

# AUDIT-FIX (N25): werkelijk Binance-perp round-trip ETH = 2-3bp
# Oude waarde 0.0012 (12bp) was 4-6× te conservatief.
spread: 0.0006                  # round-trip 6bp
half_spread: 0.0002             # voor PrimaryScout.from_config

# AUDIT-FIX (N4): sample-weight time-decay
# ETH: 180 dagen (mix van BTC-correlatie + idiosyncratische DeFi-cycles)
sample_weight_decay_days: 180

# AUDIT-FIX (N13): gap-risk ETH
# ETH: 1.5 (DeFi-cascade-events mogelijk, minder dan SOL validator-risk)
gap_atr_multiple: 1.5

# AUDIT-FIX (N20): Spearman dedup threshold
spearman_cluster_threshold: 0.15

# AUDIT-FIX (N16): CPCV bar-space purging
# t_max=22 bars → purge_bars=23
cpcv_purge_bars: 23

# Bandit parameters
bandit_gamma_max: 0.995

max_leverage: 1.75
max_portfolio_leverage: 1.75
max_portfolio_leverage_bidir: 3.5

optuna_trials: 200

# =============================================================================
# SHORT-MODEL VERBETERING (Agent C — 2026-05-22)
# ETH is uitgesloten (netto -4.1% bij 2.5bps) maar SHORT-parameters worden
# gedocumenteerd. ETH SHORT in bear-markt is potentieel winstgevend; het probleem
# is de asymmetrische labeling die bear-moves onderwaardeert.
# =============================================================================

# SHORT-specifieke CUSUM drempel
cusum_threshold_multiplier_short: 1.3    # vs 1.7 default

# SHORT-specifieke label barriers
label_pt_width_short: 1.5    # vs 2.0 voor LONG
label_sl_width_short: 0.8    # tight SL

# SHORT min_conf override
min_conf_short_max: 0.42
