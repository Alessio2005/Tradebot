# conf/experiment/h10_2_unbalanced_panel.yaml
#
# H-10.2 — HET ONEVENWICHTIGE PANEEL. Fase 10, stap 12.
#
# Zelfde twee afwijkingen als bij H-10.1, om dezelfde redenen: `planned_trials`
# in plaats van `n_trials` (de sleutel die `registry/preregistration.py` kent en
# afdwingt), en geen `M_new` in configuratie (bevroren op 25 in
# `artefacts/governance/ledger_reset.json`; een tweede kopie ontbevriest hem).
# `parameters` wordt door de app uit `conf/` geresolveerd en hier niet herhaald.
#
# ───────────────────────────────────────────────────────────────────────────────
# DE PREMISSE, VOORAF GEMETEN (R-10)
#
# De stapopdracht stelt dat de cross-sectie is afgekapt op drie symbolen vanaf
# 2021-03-15. Vóór de eerste regel implementatie is dat nagerekend op het
# gecertificeerde paneel (2.342 bars, 6 symbolen, 2020-03-26 t/m 2026-08-23).
# Dit is diagnostiek op de datadekking: geen rendement, geen Sharpe, geen
# selectie, en dus nul trials.
#
#   symbool     eerste bar    bars    jaren     stapopdracht
#   BTCUSDT     2020-03-26    2342     6,42     6,41  ✓
#   LINKUSDT    2020-10-22    2132     5,84     5,83  ✓
#   ETHUSDT     2021-03-16    1987     5,44     5,44  ✓
#   DOTUSDT     2021-03-20    1983     5,43     —
#   AVAXUSDT    2021-09-16    1803     4,94     —
#   SOLUSDT     2021-10-16    1773     4,86     —
#
# De drie getallen die de stapopdracht noemt, kloppen. Het derde symbool
# (ETHUSDT) begint op 2021-03-16 en niet op 2021-03-15 — één dag, en de strekking
# van de premisse staat.
#
# WAT NIET KLOPT, en dat staat hier vóór de meting zodat het geen achteraf-
# verklaring wordt:
#
#   (a) "groeit met ordegrootte 30 %". Gemeten op het GEREALISEERDE venster
#       (bars waarop sigma én ADV beschikbaar zijn) levert min_symbols_per_bar=2
#       op de ontwikkelsample +359 bars, en dat is +25,83 % — niet 30 %. Op het
#       volle venster is het +20,60 %.
#
#   (b) "de hurdle verlaagt naar ongeveer 0,95 op de ontwikkelsample". Gemeten
#       gaat hij van 1,0249 naar 0,9137. De 0,95 uit de stapopdracht hoort bij
#       min_symbols_per_bar=3 (0,9541), niet bij de 2 die hier is geregistreerd.
#
#   (c) "de 3,42-jarige ontwikkelsample" met hurdle 1,081. Het gebalanceerde
#       ontwikkelvenster is 1.390 bars = 3,8082 jaar met hurdle 1,0249, zoals
#       `docs/MEASUREMENT_CONTRACT.md` het ook vastlegt. De 3,42 komt nergens uit
#       deze meting.
#
# WAT DE GROEI NIET IS. De 359 bars komen uit de periode 2020-11-21 t/m
# 2021-10-15, waar het paneel SMALLER is: 145 van die bars dragen 2 namen, 4
# dragen 3, 180 dragen 4 en 30 dragen 5. Gemiddelde breedte over de toegevoegde
# bars is 3,26 tegen 6,00 op het bestaande venster; over het hele nieuwe venster
# zakt de gemiddelde breedte van 6,000 naar 5,439. De t=2-drempel `2/sqrt(T)`
# veronderstelt bars van gelijke informatie-inhoud, en deze zijn dat niet. De
# drempeldaling is dus rekenkundig echt en economisch gedeeltelijk schijn, en het
# rapport hoort beide te noemen.
# ───────────────────────────────────────────────────────────────────────────────

preregistration:
  wave: phase10_h10_2_unbalanced_panel

  title: >-
    H-10.2 — een cross-sectie met per-bar variërende breedte
    (min_symbols_per_bar = 2) in plaats van een gebalanceerd paneel, getoetst op
    de GEREALISEERDE groei van de ontwikkelsample en op de t = 2-drempel die
    daaruit volgt.

  hypothesis: >-
    De portefeuillelaag eist een gebalanceerd paneel en kapt de cross-sectie
    daarmee af op het laatst begonnen symbool. Draagt het systeem een
    onevenwichtig paneel met per-bar variërende breedte bij
    min_symbols_per_bar = 2, dan groeit de ontwikkelsample materieel zonder
    nieuwe data, en daalt de t = 2-drempel mee. De uitkomst van deze stap is die
    nieuwe drempel; zij is expliciet GEEN alfaclaim.

  null_hypothesis: >-
    De groei is niet materieel, of zij is materieel in bars maar niet in
    bewijskracht. Het tweede geval is het interessante en het wordt hier vooraf
    benoemd: een langere sample verlaagt `2/sqrt(T)` per constructie, maar die
    formule veronderstelt bars van gelijke informatie-inhoud. Bestaan de
    toegevoegde bars uit een SMALLERE cross-sectie, dan is de gemeten
    drempeldaling een overschatting van de gewonnen bewijskracht. Een Sharpe die
    op het nieuwe venster hoger uitkomt, weerlegt de nulhypothese NIET: de twee
    vensters beslaan verschillende marktperiodes en een verschil daartussen is
    een uitspraak over WELKE bars zijn toegevoegd, niet over het systeem.

  universe:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - AVAXUSDT
    - LINKUSDT
    - DOTUSDT

  granularity: 1d

  period_start: "2020-03-26"
  period_end: "2026-08-23"
  evaluation_start: "2020-11-21"

  primary_metric: t2_hurdle_development_unbalanced

  # Eén configuratie: min_symbols_per_bar = 2. Geen zoektocht over die drempel.
  # Wordt er ooit een tweede waarde geprobeerd, dan is het een tweede trial en is
  # deze er retroactief ook een (R-2). De waarden 3, 4 en 5 zijn in de
  # premissemeting hierboven WEL doorgerekend; dat is dekkingsdiagnostiek op de
  # datamatrix en er is niets uit geselecteerd — de 2 stond vast vóór die meting,
  # want de stapopdracht registreert hem.
  planned_trials: 1

  data_series:
    - crypto/ohlcv/BTCUSDT/1d
    - crypto/ohlcv/ETHUSDT/1d
    - crypto/ohlcv/SOLUSDT/1d
    - crypto/ohlcv/AVAXUSDT/1d
    - crypto/ohlcv/LINKUSDT/1d
    - crypto/ohlcv/DOTUSDT/1d

  stop_criteria:
    - name: growth_is_not_material
      metric: development_bars_added
      operator: "<="
      threshold: 0.0
      action: archive
      rationale: >-
        Zonder extra bars is er niets gebeurd. De drempel staat op 0 en niet op
        een percentage: wat "materieel" is, hangt af van de drempeldaling die
        eruit volgt, en die staat in het tweede criterium. Dit criterium vangt
        alleen het geval waarin de breedtepoort geen enkele bar toevoegt.

    - name: hurdle_does_not_fall
      metric: t2_hurdle_delta_development
      operator: ">="
      threshold: 0.0
      action: archive
      rationale: >-
        De drempel moet DALEN; dat is het hele doel van deze stap. Een niet-
        negatieve verandering betekent dat de langere sample geen meetbaarheid
        heeft gekocht en dan is de wijziging niet gerechtvaardigd, ook niet als
        er bars bij zijn gekomen.

    - name: added_bars_are_not_thinner_than_the_existing_ones
      metric: mean_breadth_added_bars_minus_existing
      operator: "<"
      threshold: 0.0
      action: descope
      rationale: >-
        Dit criterium bindt VERWACHT, en het staat hier juist daarom. De
        toegevoegde bars komen uit de periode voordat het universum vol was, dus
        zij zijn per constructie smaller. `descope` en niet `archive`: de
        drempeldaling blijft echt, maar zij mag niet als volle bewijswinst worden
        gepresenteerd, en het rapport moet de breedteverdeling naast de
        drempeldaling zetten. Bindt hij NIET, dan zijn de toegevoegde bars even
        breed als de bestaande en is dat een sterker resultaat dan verwacht.

    - name: promotion_requires_all_gates_clear
      metric: n_binding_stop_criteria
      operator: "<="
      threshold: 0.0
      action: promote
      rationale: >-
        De wijziging wordt pas aanbevolen wanneer er bars bij komen, de drempel
        daalt, en de toegevoegde bars niet smaller zijn dan de bestaande. Dat
        laatste wordt vermoedelijk niet gehaald; zie het criterium hierboven.
