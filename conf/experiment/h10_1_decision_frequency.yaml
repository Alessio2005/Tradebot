# conf/experiment/h10_1_decision_frequency.yaml
#
# H-10.1 — DE BESLISFREQUENTIE. Fase 10, stap 11.
#
# TWEE AFWIJKINGEN VAN DE LETTER VAN DE STAPOPDRACHT, BEIDE BEWUST.
#
# (1) De stapopdracht schrijft de sleutels `n_trials: 4` en `M_new: 10` voor.
#     Geen van beide bestaat in het schema dat deze repository daadwerkelijk
#     leest (`registry/preregistration.py::_SPEC_KEYS`); het schema weigert
#     onbekende sleutels expliciet, omdat een typo nooit stilzwijgend mag
#     betekenen dat een afspraak niet bestaat. Het aantal trials staat hier
#     daarom als `planned_trials: 4` -- dezelfde afspraak, de naam die de
#     machinerie kent.
#
#     `M_new` staat hier BEWUST NIET. Het is met AD-24 eenmalig bevroren op 25
#     in `artefacts/governance/ledger_reset.json` en wordt uitsluitend gelezen
#     via `registry.ledger_reset.active_trial_count()`. Een tweede kopie in
#     configuratie zou een bevroren getal een tweede bron geven, en dan is het
#     niet meer bevroren. De DSR van deze hypothese deflateert met M = 25,
#     ongeacht hoeveel trials er op het moment van meten geboekt staan.
#
# (2) De stapopdracht schrijft het pad `conf/experiment/` voor en dat pad is
#     hier aangehouden. De vier bestaande pre-registraties staan in
#     `conf/research/preregistration_*.yaml`; dit bestand is er het vijfde van
#     naar vorm en het eerste onder `conf/experiment/`. Het draait door
#     dezelfde `load_preregistration_spec` en `freeze_preregistration` -- er is
#     GEEN tweede mechanisme bijgekomen, alleen een tweede map.
#
# WAT HIER NIET STAAT. `parameters:` wordt door de app uit `conf/` geresolveerd
# en niet in deze YAML herhaald (zie `load_preregistration_spec`, §docstring):
# een tweede kopie van dezelfde drempels kan uit de pas lopen met de
# configuratie waarmee daadwerkelijk is gemeten, en dan pint de registratie
# iets anders vast dan er is gemeten.
#
# DE SELECTIE IS HIER VASTGELEGD, NIET IN HET RAPPORT. Vier trials is vier
# waarden van k op EEN vooraf benoemde (track, laag, maat)-combinatie. De
# ladder rekent alle vier tracks en alle vier lagen in dezelfde run door; die
# overige cellen zijn DIAGNOSTIEK en er mag niets uit worden geselecteerd.
# Zou de gunstigste cel uit 4 tracks x 4 lagen x 4 k mogen worden gekozen, dan
# was dit een zoektocht over 64 cellen en geen hypothese van vier trials.
#
# ───────────────────────────────────────────────────────────────────────────────
# EEN VOORSPELLING, VOORAF, OP GROND VAN DE STRUCTUUR VAN DE ALLOCATOR
#
# Vóór de eerste run is de gewichtsMATRIX van de vier tracks doorgemeten -- geen
# rendement, geen Sharpe, geen selectie, alleen de vraag hoe vaak een allocator
# van besluit verandert. Dat is diagnostiek op de allocator en kost geen trial,
# net als stap 10. Op het volledige paneel van 2.342 bars:
#
#   | track                    | bars met gewichtswijziging | unieke gewichtsrijen |
#   |--------------------------|---------------------------:|---------------------:|
#   | long_only_equal_weight   |                 6  (0,3 %) |                    7 |
#   | xs_momentum_equal_weight |               914 (39,0 %) |                  341 |
#   | xs_momentum_risk_parity  |              1926 (82,2 %) |                 1927 |
#   | long_only_risk_parity    |              2132 (91,0 %) |                 2133 |
#
# En uit de nulmeting van de ladder: `long_only_equal_weight` halteert op
# `L3_execution` 1.566 van 1.742 bars, en de twee `xs_momentum`-tracks
# halteren NUL bars.
#
# DE VOORSPELLING. De causale keten van de hypothese is: minder besluiten ->
# minder omzet -> minder kosten -> minder drawdown -> minder haltes. De eerste
# schakel bestaat op de PRIMAIRE track vermoedelijk niet. Een gelijkgewogen
# long-only boek op een universum dat niet van samenstelling verandert, IS een
# constant gewichtsvector: 7 unieke rijen op 2.342 bars. Vasthouden van een
# besluit dat niet verandert, is de identiteit. De voorspelling is daarom dat
# `turnover_delta` op de primaire cel vrijwel nul is, dat het aantal haltes niet
# beweegt, en dat `breakeven_cost_bps` daar geen oplossing heeft.
#
# WAAROM DE PRIMAIRE CEL DAAROM NIET WORDT VERPLAATST. De hypothese gaat over de
# HALTKETEN, en de haltketen bijt uitsluitend op `long_only_equal_weight`. De cel
# volgt dus uit de hypothese en niet uit haar meetbaarheid. Haar nu verplaatsen
# naar een `xs_momentum`-track -- in de wetenschap dat daar omzet zit -- zou de
# cel kiezen op meetbaarheid, en dat is de aanpassing die R-2 en R-10 verbieden.
# De `xs_momentum`-tracks worden gerapporteerd als DIAGNOSTIEK, om te lokaliseren
# wélke schakel breekt, en er wordt niets uit geselecteerd.
#
# DIT IS EEN VOORSPELLING EN GEEN UITKOMST (R-10). Zij staat hier zodat de
# meting haar kan weerleggen. Wijkt de meting af, dan is de meting het antwoord
# en wordt deze alinea geciteerd als de weerlegde voorspelling die zij was.
# ───────────────────────────────────────────────────────────────────────────────

preregistration:
  wave: phase10_h10_1_decision_frequency

  title: >-
    H-10.1 — de beslisfrequentie k in {1, 2, 5, 10} bars op de
    portefeuille-expositie, met de haltketen NA het vasthouden, getoetst op
    netto Sharpe van `long_only_equal_weight` bij `L3_execution`.

  hypothesis: >-
    De haltketen halteert het overgrote deel van de bars omdat hij per dag een
    besluit eist. Wordt het besluit met frequentie k genomen (k in {1, 2, 5,
    10} bars) en tussentijds vastgehouden, dan daalt het aantal haltes en de
    gemiddelde omzet zonder dat het rendement wordt vernietigd: er bestaat een
    k > 1 waarvoor de netto Sharpe van `long_only_equal_weight` bij
    `L3_execution` hoger is dan bij k = 1, met een 95 %-interval dat nul
    uitsluit na deflatie met M = 25, met hetzelfde teken op het poortsample, en
    met een breakevenkostenniveau onder de kostenaanname die deze repository
    daadwerkelijk hanteert.

  null_hypothesis: >-
    De beslisfrequentie is niet de oorzaak van de haltes. Onder deze
    nulhypothese verandert het aantal haltes niet wezenlijk met k, en is het
    verschil in netto Sharpe tussen k > 1 en k = 1 niet van nul te
    onderscheiden. Een daling van de omzet die NIET door de haltes of door de
    netto Sharpe wordt gevolgd, weerlegt de hypothese en bevestigt haar niet:
    de hypothese stelt een causale keten (minder besluiten -> minder omzet ->
    minder kosten -> minder drawdown -> minder haltes) en het breken van een
    schakel daarin is een weerlegging van de keten. Een verschil in netto
    Sharpe zonder dat de haltes bewegen, is een kostenbevinding en geen
    bevestiging van DEZE hypothese.

  universe:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - AVAXUSDT
    - LINKUSDT
    - DOTUSDT

  granularity: 1d

  period_start: "2021-11-15"
  period_end: "2026-08-23"
  evaluation_start: "2021-11-15"

  primary_metric: net_sharpe_l3_long_only_equal_weight

  # Vier trials: k in {1, 2, 5, 10}. k = 1 is de identiteit en dus de
  # referentie, maar hij is GEEN gratis cel -- hij is de tak waartegen de drie
  # andere worden gelezen en R-2 rekent een beslistak als een trial.
  planned_trials: 4

  data_series:
    - crypto/ohlcv/BTCUSDT/1d
    - crypto/ohlcv/ETHUSDT/1d
    - crypto/ohlcv/SOLUSDT/1d
    - crypto/ohlcv/AVAXUSDT/1d
    - crypto/ohlcv/LINKUSDT/1d
    - crypto/ohlcv/DOTUSDT/1d

  stop_criteria:
    - name: no_improvement_on_development
      metric: delta_net_sharpe_development_best_k
      operator: "<="
      threshold: 0.0
      action: archive
      rationale: >-
        Deel (1) van de beslisregel. Is het beste gemeten verschil tegen k = 1
        op de ontwikkelsample niet positief, dan is er niets om naar de poort
        te brengen en is het oordeel UNPROVEN. Dit criterium kijkt naar het
        PUNT en niet naar het interval; het interval is criterium twee. Een
        punt onder nul sluit de vraag af voordat de poortsample wordt
        aangeraakt, en dat is precies de bedoeling van R-7.

    - name: deflated_interval_includes_zero
      metric: dsr_development_best_k
      operator: "<"
      threshold: 0.95
      action: archive
      rationale: >-
        Deel (2). De deflated Sharpe ratio bij M = 25 (AD-24, bevroren in
        `ledger_reset.json`) moet ten minste 0,95 zijn. Bij M = 25 en N = 1390
        vraagt dat een geannualiseerde Sharpe van orde 1,74, en de hele
        vier-lagen-ladder haalt op geen enkele cel de helft daarvan. Dit
        criterium is daarom vrijwel zeker bindend, en dat is geen reden om het
        te verzachten: het is de rekenkundige stand van het programma en die
        hoort in het oordeel te staan in plaats van eromheen.

    - name: sign_flips_on_gate_sample
      metric: delta_net_sharpe_gate_best_k
      operator: "<="
      threshold: 0.0
      action: archive
      rationale: >-
        Deel (3). Hetzelfde teken op het bevroren poortsample (W_GATE,
        2025-09-05 t/m 2026-08-23, 353 bars, 0,9671 jaar). Het poortsample
        wordt precies eenmaal gelezen, uitsluitend voor de k die op de
        ontwikkelsample het gunstigst is, en die lezing is onherroepelijk
        (`validation/holdout.py::gate_slice` schrijft de lezing weg VOORDAT hij
        data teruggeeft). W_GATE draagt bewust geen t = 2-drempel: op 0,9671
        jaar is de standaardfout van een Sharpe ongeveer 1,02 en dat venster
        kan een effect van deze orde niet aantonen. Het is een tekencontrole en
        geen bewijs.

    - name: breakeven_above_plausible_cost
      metric: breakeven_cost_bps_development_best_k
      operator: ">"
      threshold: 6.5
      action: archive
      rationale: >-
        Deel (4). De drempel is `taker_fee_bps + assumed_half_spread_bps` =
        5,5 + 1,0 = 6,5 bp uit `conf/execution/fees.yaml` -- de enige kosten
        per eenheid omzet die deze repository daadwerkelijk beweert, en de
        waarde waarmee de ladder op L0/L1/L2 rekent. Ligt het breakevenniveau
        BOVEN 6,5 bp, dan betaalt het vasthouden zich pas terug bij kosten die
        hoger zijn dan wat hier wordt aangenomen, en dan is de winst een
        gevolg van de kostenaanname en geen eigenschap van het systeem. De
        drempel staat hier vooraf vast, juist omdat `eta` ongekalibreerd is
        (AD-2, `IMPACT_UNCALIBRATED`): een drempel die na de meting wordt
        gekozen, is geen drempel.

    - name: effect_is_demonstrably_negative
      metric: ci_high_delta_net_sharpe_development_best_k
      operator: "<"
      threshold: 0.0
      action: falsify
      rationale: >-
        REJECTED is voorbehouden aan een AANTOONBAAR negatief effect, en niet
        aan een afwezig effect. Dit criterium bindt alleen wanneer de
        BOVENgrens van het 95 %-interval op het beste verschil onder nul ligt:
        dan is niet alleen het punt negatief maar sluit het interval nul uit
        aan de verkeerde kant. Alles daartussen is UNPROVEN.

    - name: promotion_requires_all_gates_clear
      metric: n_binding_stop_criteria
      operator: "<="
      threshold: 0.0
      action: promote
      rationale: >-
        CONFIRMED vereist alle vier delen van de beslisregel tegelijk.
        Ontbreekt er een, dan is het UNPROVEN. Dit criterium maakt die
        conjunctie machinaal leesbaar in plaats van iets dat in het rapport
        moet worden nagelopen.
