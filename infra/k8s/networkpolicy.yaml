# =============================================================================
# NetworkPolicy — default deny, plus egress voor het carry-shadowboek.
#
# De CronJob haalt maandarchieven van data.binance.vision (S3, HTTPS). Er is geen
# ingress: het shadowboek draait als batch en serveert niets.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tradebot-default-deny
  namespace: tradebot
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tradebot-carry-shadow-egress
  namespace: tradebot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: carry-shadow
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
