# =============================================================================
# Secret template — DO NOT COMMIT the populated form. Use:
#   kubectl create secret generic tradebot-binance -n tradebot \
#     --from-literal=BINANCE_API_KEY=*** \
#     --from-literal=BINANCE_API_SECRET=*** \
#     --from-literal=SLACK_WEBHOOK_URL=***
# Or use SealedSecrets / External Secrets Operator for GitOps workflows.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: tradebot-binance
  namespace: tradebot
  annotations:
    # Reload deployments when secret rotates.
    reloader.stakater.com/match: "true"
type: Opaque
stringData:
  BINANCE_API_KEY:    "REPLACE_ME"
  BINANCE_API_SECRET: "REPLACE_ME"
  SLACK_WEBHOOK_URL:  "REPLACE_ME"
