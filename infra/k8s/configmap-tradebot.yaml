apiVersion: v1
kind: ConfigMap
metadata:
  name: tradebot-config
  namespace: tradebot
data:
  # Niet-geheime runtime-omgeving. `python -I` negeert PYTHONPATH: de package is editable
  # geinstalleerd in het image (infra/docker/Dockerfile.runner).
  TZ:                UTC
  PYTHONUNBUFFERED:  "1"
  NUMBA_CACHE_DIR:   /tmp/numba_cache
