# infra/compose/docker-compose.yml — de diensten op één server.
#
# Options-paper (standaard, fictief geld; docs/runbook-options.md):
#   cp infra/compose/.env.example infra/compose/.env         # TWS_USERID, TWS_PASSWORD
#   docker compose -f infra/compose/docker-compose.yml up -d --build ib-gateway options-paper
#
# Het Kraken-boek (v9-U1), in standby:
#
#   cp conf/live/u1.example.yaml infra/compose/u1.yaml      # en aanpassen (kapitaal, grenzen)
#   cp infra/compose/.env.example infra/compose/.env         # sleutels en alarmkanalen
#   docker compose -f infra/compose/docker-compose.yml --profile crypto up -d --build u1
#
# Beheer (docs/runbook-kraken-u1.md, "Op een server"):
#   docker compose -f infra/compose/docker-compose.yml logs -f u1
#   docker compose -f infra/compose/docker-compose.yml exec u1 touch /var/lib/tradebot/HALT
#   docker compose -f infra/compose/docker-compose.yml exec u1 \
#       python -I -m tradebot.carry.u1 status --config /etc/tradebot/u1.yaml
#
# De dienst schrijft alleen in het volume `tradebot-state` (staat, logboek, backups,
# heartbeat). Het containerbestandssysteem is read-only, zonder capabilities.
# `restart: unless-stopped` herstart na een crash of reboot; een container die "unhealthy"
# wordt (geen heartbeat), herstart compose NIET vanzelf: daarvoor is `HEARTBEAT_URL` (een
# dead man's switch die van buiten alarmeert).
name: tradebot

services:
  # Crypto in standby sinds 2026-11 (docs/crypto-standby.md): de U1-dienst start alleen met
  # `docker compose --profile crypto up -d u1`.
  u1:
    profiles: ["crypto"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.runner
    image: tradebot-runner:local
    command: ["python", "-I", "-m", "tradebot.carry.service",
              "--config", "/etc/tradebot/u1.yaml"]
    env_file: .env
    volumes:
      - ./u1.yaml:/etc/tradebot/u1.yaml:ro
      - tradebot-state:/var/lib/tradebot
    restart: unless-stopped
    # SIGTERM rondt de lopende ronde af; geef die tijd voordat docker SIGKILL stuurt.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-I", "-m", "tradebot.carry.service",
             "--config", "/etc/tradebot/u1.yaml", "--healthcheck"]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 3m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  # Options (2026-11): de paper-dienst tegen IB Gateway in paper-modus. Fictief geld.
  # TRADING_MODE staat hier vast op paper; de dienst weigert bovendien elk account dat
  # niet met DU begint (src/tradebot/options/live.py).
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    env_file: .env               # TWS_USERID en TWS_PASSWORD (de paper-login)
    environment:
      TRADING_MODE: paper        # vast: wint van wat er in .env staat
      READ_ONLY_API: "no"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  options-paper:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.runner
    image: tradebot-runner:local
    command: ["python", "-I", "-m", "tradebot.options", "paper",
              "--run-dir", "/var/lib/tradebot/options"]
    env_file: .env
    environment:
      IB_HOST: ib-gateway
      IB_PORT: "4004"            # de paper-poort van de gateway-container
    depends_on:
      - ib-gateway
    volumes:
      - tradebot-state:/var/lib/tradebot
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-I", "-m", "tradebot.options", "paper",
             "--run-dir", "/var/lib/tradebot/options", "--healthcheck"]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 5m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

volumes:
  tradebot-state:
